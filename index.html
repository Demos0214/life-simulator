<style>
:root{
  --bg1:#eaf0f8; --bg2:#f7f4ef;
  --card:#ffffff; --card2:#fbfcfe; --line:#e7eaf2; --line2:#eef1f7;
  --ink:#1d2733; --muted:#76828f;
  --p:#2f6fdb; --p-d:#1b4fa0; --p2:#3aa0d8; --p-soft:#eaf1fe; --p-ink:#1b4fa0;
  --blue:#185fa5; --teal:#0f6e56; --amber:#854f0b; --coral:#993c1d; --green:#3b6d11;
  --iq:#7c5cff; --eq:#2f9e75; --look:#e2619b; --health:#2f9e44; --luck:#d99b16; --knowledge:#3b82f6;
  --shadow:0 6px 22px rgba(28,42,80,.07);
  --shadow-lg:0 12px 34px rgba(28,42,80,.12);
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{min-height:100%;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(124,92,255,.10), transparent 60%),
    radial-gradient(1000px 520px at -10% 110%, rgba(47,158,117,.10), transparent 55%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  color:var(--ink); line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:860px;margin:0 auto;padding:22px 16px 44px;}
h1{font-size:30px;margin:0 0 4px;letter-spacing:-.5px;}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:16px;}

/* ===== cards ===== */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:14px;box-shadow:var(--shadow);
  animation:fadeUp .38s cubic-bezier(.22,.61,.36,1) both;
}
.card + .card{animation-delay:.05s;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ===== start hero ===== */
#app:has(h1) h1{
  font-size:33px;font-weight:800;letter-spacing:-.5px;line-height:1.2;
  background:linear-gradient(92deg,#2f6fdb,#7c5cff 55%,#e2619b);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  display:inline-block;
}
#app:has(h1) h1::after{
  content:"";display:block;width:56px;height:4px;border-radius:4px;margin-top:10px;
  background:linear-gradient(90deg,#2f6fdb,#7c5cff,#e2619b);
}
#app:has(h1) .sub{margin-bottom:18px;}

/* ===== topbar ===== */
.topbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;}
.who{font-size:18px;font-weight:700;}
.age{font-size:13px;color:var(--muted);}
.seedbox{font-size:12px;color:var(--muted);}
.seedbox b{color:var(--p);}

/* ===== attributes grid ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin-top:10px;}
.attr{display:flex;flex-direction:column;gap:4px;}
.attr .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);}
.attr .lab span:last-child{font-weight:700;color:var(--ink);}
.bar{height:8px;border-radius:8px;background:#eef1f6;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.05);}
.bar > i{display:block;height:100%;border-radius:8px;transition:width .55s cubic-bezier(.22,.61,.36,1);}

/* ===== resource pills ===== */
.res{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;margin-top:12px;}
.res .pill{
  background:var(--p-soft);border:1px solid #dbe7fb;color:var(--p-ink);
  border-radius:999px;padding:4px 11px;font-weight:500;transition:.15s;
}
.res .pill:hover{border-color:var(--p);}
.stage{font-size:13px;color:var(--teal);font-weight:700;margin-bottom:8px;letter-spacing:.3px;}

/* ===== narrative + options ===== */
.narr{font-size:15.5px;margin:8px 0 14px;line-height:1.85;color:#2c3744;}
.opts{display:flex;flex-direction:column;gap:10px;}
button.opt{
  text-align:left;background:#fbfcfe;border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;font-size:14px;color:var(--ink);cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease,background .12s ease;
}
button.opt:hover{border-color:var(--p);background:#f3f8ff;box-shadow:0 6px 18px rgba(47,111,219,.12);transform:translateY(-1px);}
button.opt:active{transform:translateY(0);box-shadow:0 2px 8px rgba(47,111,219,.10);}
button.opt small{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.55;}
button.opt.disabled{opacity:.55;cursor:not-allowed;background:#f4f6f9;border-style:dashed;}
button.opt.disabled:hover{border-color:var(--line);background:#f4f6f9;box-shadow:none;transform:none;}
button.opt .lock{color:#b06a1a;}

/* ===== buttons / actions ===== */
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
button.act{
  background:linear-gradient(180deg,#3a78e6,#2f6fdb);color:#fff;border:none;border-radius:11px;
  padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;
  box-shadow:0 6px 16px rgba(47,111,219,.28);transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
}
button.act:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(47,111,219,.34);}
button.act:active{transform:translateY(0);}
button.act.ghost{background:#eef2f8;color:var(--ink);box-shadow:none;border:1px solid var(--line);}
button.act.ghost:hover{background:#e4ebf6;box-shadow:none;}

/* ===== life log ===== */
.log{max-height:240px;overflow:auto;font-size:12.5px;color:#3a4654;padding-right:4px;}
.log .li{padding:6px 0;border-bottom:1px dashed #eef1f7;}
.log .li b{color:var(--coral);margin-right:6px;}
.log::-webkit-scrollbar{width:8px;}
.log::-webkit-scrollbar-thumb{background:#d7deea;border-radius:8px;}

/* ===== result ===== */
.result{background:linear-gradient(180deg,#f1f8f3,#eaf6ef);border:1px solid #cfe9dd;border-radius:12px;padding:13px 15px;font-size:14px;margin-bottom:12px;line-height:1.85;}
.card:has(.result){border-color:#cfe9dd;}
.scoregrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0;}
.sc{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;transition:.15s;}
.sc:hover{border-color:var(--p);box-shadow:var(--shadow);}
.sc .v{font-size:24px;font-weight:800;color:var(--p);}
.sc .k{font-size:12px;color:var(--muted);margin-top:2px;}

/* ===== end screen hero ===== */
.card:has(.evalucon){
  background:linear-gradient(165deg,#ffffff,#eef4ff);
  border:1px solid #d6e6ff;text-align:center;
}
.title-big{font-size:28px;font-weight:800;text-align:center;background:linear-gradient(92deg,#e0531a,#993c1d);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0;}
.title-sub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:8px;}
.evalucon{width:96px;height:96px;margin:0 auto 6px;display:block;filter:drop-shadow(0 8px 18px rgba(47,111,219,.25));}

/* ===== deltas ===== */
.deltas{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.dchip{font-size:12px;padding:4px 10px;border-radius:999px;font-weight:700;animation:pop .32s ease both;}
@keyframes pop{from{opacity:0;transform:scale(.8);}to{opacity:1;transform:none;}}
.dchip.up{background:#e7f6ec;color:#1f7a3d;}
.dchip.down{background:#fdeaea;color:#b42318;}
.dchip.good{background:#e8f0fe;color:#185fa5;}
.dchip.neutral{background:#f1f3f6;color:#6b7280;}
.deltatip{font-size:12px;color:var(--muted);margin-top:6px;}

/* ===== inputs ===== */
input[type=text]{
  padding:10px 12px;border:1px solid var(--line);border-radius:11px;font-size:14px;width:200px;
  background:#fbfcfe;transition:.15s;
}
input[type=text]:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(47,111,219,.14);}

/* ===== pace / toggle groups ===== */
.pace{display:flex;gap:8px;flex-wrap:wrap;}
.pace button{
  font-size:12.5px;padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;
  color:var(--ink);font-weight:500;transition:.15s;
}
.pace button:hover{border-color:var(--p);background:#f3f8ff;}
.pace button.on{background:linear-gradient(180deg,#3a78e6,#2f6fdb);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(47,111,219,.25);}

/* ===== misc ===== */
.tip{font-size:12px;color:var(--muted);}
.ill{width:56px;height:56px;float:right;margin:0 0 6px 12px;}
.illwrap{display:flex;align-items:flex-start;gap:12px;}
.illwrap .ill{flex:0 0 auto;float:none;margin:0;}
.illwrap .txt{flex:1;min-width:0;}
.bgdesc{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6;background:#f7f9fc;border-left:3px solid var(--p);padding:7px 11px;border-radius:0 8px 8px 0;}
.hide{display:none;}
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px;padding:12px 2px 2px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);}
.foot span:first-child{color:var(--p);font-weight:600;}

/* ===== responsive ===== */
@media (max-width:600px){
  .wrap{padding:14px 12px 34px;}
  #app:has(h1) h1{font-size:26px;}
  h1{font-size:24px;}
  .card{padding:14px;margin-bottom:12px;border-radius:14px;}
  .grid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 12px;}
  button.act,button.opt{font-size:13.5px;}
  input[type=text]{width:100%;}
  .topbar{gap:6px;}
  .scoregrid{grid-template-columns:repeat(auto-fit,minmax(95px,1fr));}
  .sc .v{font-size:20px;}
  .title-big{font-size:23px;}
}
</style>
</head>

/* ===================== 工具：种子化随机数（可序列化） ===================== */
function xmur3(str){
  let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0;};
}
let RngState=0;
function initRng(seed){ RngState=(xmur3(seed)())>>>0; }
function rng(){
  RngState|=0;
  RngState=RngState+0x6D2B79F5|0;
  let t=Math.imul(RngState^RngState>>>15,1|RngState);
  t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296;
}
function R(min,max){return Math.floor(rng()*(max-min+1))+min;}
// 同回合掷骰缓存：同一回合内、相同成功率的多次 chance 判定共享同一次掷骰。
// 目的：大量事件选项的 ef（实际结算）与 res（结果文案）各自调用 chance(同一表达式)，
// 若两次独立随机，约一半概率出现「实际加薪了、文案却说谈崩了」的自相矛盾。
// 缓存后两者必然一致；叙事上等价于「同年运势一致」，顺理成章。每年在 advanceYear 里清空。
let _yearRolls=null;
function chance(p){
  p=clamp(p,0,1);
  if(_yearRolls){
    const k=Math.round(p*100000);
    if(_yearRolls[k]===undefined) _yearRolls[k]=(rng()<p);
    return _yearRolls[k];
  }
  return rng()<p;
}
function pick(arr){return arr[Math.floor(rng()*arr.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
// 生成分享种子：必须用原生随机（Math.random），不能用 rng()——
// rng 依赖 RngState，页面刷新后 RngState 归零，会每次都生成同一个种子。
function genSeed(){const s="abcdefghijklmnopqrstuvwxyz0123456789";let o="";for(let i=0;i<12;i++)o+=s[Math.floor(Math.random()*s.length)];return o;}

/* ===================== MBTI 性格系统 ===================== */
// 16 型人格（基于最新 MBTI® Step II™ 框架，组织/临床常用版本）。
// 四维：E外倾/I内倾、S实感/N直觉、T思考/F情感、J判断/P知觉。

  ENTP:{name:"辩论家",group:"分析家",read:"点子王与破局者，善辩敢闯却难守常规。",
        fitTracks:["创业","互联网","金融"],unfitTracks:["事业","蓝领"],

  INFP:{name:"调停者",group:"外交家",read:"温柔的理想派，重意义轻规则。",

const MBTI_DIST={
  ISTJ:11,ISFJ:9,ESTJ:8,ESFJ:9,ISTP:5,ISFP:6,ESTP:4,ESFP:7,
  INFJ:2,INFP:4,ENFJ:3,ENFP:7,INTJ:2,INTP:3,ENTJ:2,ENTP:3

const MBTI_KEYS=Object.keys(MBTI_TYPES);
// 默认按真实分布随机抽一个类型（非均匀，更贴近现实人群）
function mbtiRandom(){
  let total=0; for(const k of MBTI_KEYS) total+=MBTI_DIST[k]||1;
  let r=rng()*total;
  for(const k of MBTI_KEYS){ r-=(MBTI_DIST[k]||1); if(r<=0) return k; }
  return "ISFJ";
}
// 开局性格初始化：在 newState 中调用，按四维偏移生成属性增减（延迟求值，避免加载即执行）
function mbtiInit(type){
  const arr=(MBTI_TYPES[type]||MBTI_TYPES.ISFJ).init; // [iq±, eq±, knowledge±, health±, look±, luck±]
  const pick=(lo,hi)=>R(lo,hi);
  return {iq:pick(arr[0],arr[1]), eq:pick(arr[2],arr[3]), knowledge:pick(arr[4],arr[5]),
          health:pick(arr[6],arr[7]), look:pick(arr[8],arr[9]), luck:pick(arr[10],arr[11])};
}
// 性格对职业的晋升适配加成：匹配擅长赛道加分，错配赛道减分（封顶避免压倒性）
function mbtiCareerBonus(type, career){
  if(!type||!career) return 0;
  const t=MBTI_TYPES[type]; if(!t) return 0;
  const tr=CAREERS[career]?CAREERS[career].track:null;
  if(t.fitTracks.includes(tr)) return 4;        // 性格与职业对路，晋升更顺
  if(t.unfitTracks.includes(tr)) return -3;     // 性格与职业错配，晋升受阻
  return 0;
}
// 给 UI 用的性格简介（含适配方向、社交与恋爱倾向提示）
function mbtiBlurb(type){
  const t=MBTI_TYPES[type]; if(!t) return "";
  const fit=(t.fitTracks||[]).map(x=>TRACK_CN[x]||x).join("、");
  const c=t.code||type;
  let soc = (c[0]==="E")?"外向的你更爱凑热闹、脱单主动":(c[0]==="I")?"内向的你偏独处、缘分要慢慢等":"你社交随缘";
  let lov = (c[2]==="F")?"重感情的你擅长经营亲密":(c[2]==="T")?"理性的你更慢热、伴侣要处得来":"你感情随缘";
  return `${t.name}（${t.group}）：${t.read} 适配方向：${fit}。社交上——${soc}；感情里——${lov}。`;
}

//   外向 E 比内向 I 更易打开局面；情感 F 比思考 T 更易共情黏合；判断 J 比知觉 P 更早安定成家。
//   修正幅度克制（±5~6），避免压倒属性本身的差异，仅体现“性格让缘分更难/更易”的现实倾向。
function mbtiRomanceMod(type){
  if(!type) return 0;
  const t=MBTI_TYPES[type]; if(!t) return 0;
  const c=t.code || type;   // 四维字母：c[0]=E/I, c[1]=S/N, c[2]=T/F, c[3]=J/P
  let m=0;
  if(c[0]==="E") m+=5; else if(c[0]==="I") m-=5;   // 外倾更易主动/被接纳
  if(c[2]==="F") m+=4; else if(c[2]==="T") m-=3;   // 情感更易经营亲密
  if(c[3]==="J") m+=3; else if(c[3]==="P") m-=3;   // 判断更早安定
  return m;
}
// 性格对「社交主动成功率 / 社交意愿」的修正（返回 0~1 的倍率，作用于社交相遇、团建等触发概率）：
//   外向、情感、判断型更愿意也更擅长经营关系；内向、思考、知觉型更倾向独处。
function mbtiSocialChance(type){
  if(!type) return 1;
  const t=MBTI_TYPES[type]; if(!t) return 1;
  const c=t.code || type;
  let m=1;
  if(c[0]==="E") m+=0.12; else if(c[0]==="I") m-=0.12;
  if(c[2]==="F") m+=0.08; else if(c[2]==="T") m-=0.06;
  if(c[3]==="J") m+=0.05; else if(c[3]==="P") m-=0.05;
  return clamp(m,0.6,1.4);
}

    // 艺体类可走：才艺/手艺/低门槛行业；国企行政宣传、事业单位文艺岗也收（现实如此）
    return ["自由职业","演艺明星","体育竞技","创业","服务业","工人","制造业","国企","事业单位"].includes(careerKey);

}

function salaryFor(key,idx){
  const c=CAREERS[key];
  let s=c.base*Math.pow(c.grow||1.16,idx);
  if(c.mgmtFrom && idx>=c.mgmtFrom) s*=1.70;      // 进入管理层工资大幅跃升
  if(c.volatile) s*=(0.6+rng()*1.5);             // 创业/自由/艺体波动极大：可能惨淡，也可能爆赚
  return Math.round(s);
}
// 在基础工资之上叠加：证书薪水倍率(c.salary 累加) + 职称等级(titleLevel*3%)。
// 作为“单一事实来源”，考证/评职称/晋升时都调用它，避免多次叠加导致薪水失控。
function salaryWithCerts(){
  if(!S.career) return 0;
  const certMul=Math.min(S.certs.reduce((s,c)=>s+((CERTS.find(x=>x.key===c)||{}).salary||0),0),0.2); // 证书加成上限20%
  const titleMul=S.titleLevel*0.03;
  const cityMul=(S.cityMod&&S.cityMod.salaryMul)?S.cityMod.salaryMul:((S.regionMod&&S.regionMod.salaryMul)?S.regionMod.salaryMul:1);
  return Math.round(salaryFor(S.career,S.rankIdx)*(1+certMul+titleMul)*cityMul*eraSalaryMul());
}

function findBg(k){ return BACKGROUNDS.find(b=>b.key===k)||BACKGROUNDS[3]; }
// 出身/地区影响：以给定加成值为「中枢」，在 ±spread 范围内浮动（不是固定加减）。
// 例：干部家庭智商中枢 +3 → 实际影响在 +1~+5 之间随机。
function bgImpact(mod, spread){
  const m=mod||0;
  return m + R(-spread, spread);
}
function newState(name,seed,gender,bgKey,regionKey,mbtiKey,eraKey){
  initRng(seed);
  const b=findBg(bgKey);
  const r=findRegion(regionKey);
  // 性格：未指定则按真实人群分布抽取；指定则用指定类型
  const mbti = mbtiKey && MBTI_TYPES[mbtiKey] ? mbtiKey : mbtiRandom();
  const mi = mbtiInit(mbti);
  // 时代：未指定则随机抽一档；指定则用指定年代
  const era = eraKey && ERA_MOD[eraKey] ? eraKey : eraRandom();
  const bornYear = era ? findEra(era).born : 1985;
  S={
    name:name||"无名氏", seed, bg:b.key, region:r.key, gender:gender||"M", mbti, era, bornYear,
    age:0,
    // 开局属性 = 完全随机基础值(0~100) + 出身影响(中枢浮动) + 地区影响(中枢浮动) + 性格偏移，
    // 全部影响加总后 clamp 到 [0,150]。
    iq:clamp(R(0,100)+bgImpact(b.iq,2)+bgImpact(r.iq,1)+mi.iq,0,150),
    eq:clamp(R(0,100)+bgImpact(b.eq,2)+bgImpact(r.eq,1)+mi.eq,0,150),
    look:clamp(R(0,100)+bgImpact(b.look,2)+bgImpact(r.look,1)+mi.look,0,150),
    health:clamp(R(0,100)+bgImpact(b.health,2)+bgImpact(r.health,1)+mi.health,0,150),
    luck:clamp(R(0,100)+bgImpact(b.luck,2)+bgImpact(r.luck,1)+mi.luck,0,150),
    // 财富(万)：出生到工作前=家庭资产为主，个人不轻易变动（浮动区间也放大了）
    wealth:b.wealth+(r.wealth||0)+Math.round(R(-8,12)),
    // 名望：一般出身=0，只有干部/富商/商人/书香门第等特殊出身才有初始名望
    status:clamp(b.status||0,0,150),
    happy:clamp(R(0,100)+bgImpact(b.happy,2)+bgImpact(r.happy,1),0,150),
    // 学识：初始为 0，从 3 岁起每年自然增长（上学后增速提升，详见 knowledgeDrift）；性格偏移并入
    knowledge:clamp(mi.knowledge,0,150),
    career:null, track:null, rank:null, rankIdx:-1, salary:0, retired:false, majorFit:null,
    grad:null, abroad:false, spouse:null, dating:null, children:0, childrenList:[],
    edu:{school:null, high:null, major:null, uni:null, tier:null, branch:null, level:"未定"},
    effort:0, pending:null, usedEvents:[], log:[], alive:true, titles:[],
    // 新增状态位：出身影响标记、结婚年龄、是否已购房、人生大事提醒队列
    flags:{}, marryAge:null, hasHouse:false, mortgage:0, mortgageEndAge:null, notables:[],
    // 本轮新增：地区修正(高考/收入)、特长、证书、职称等级、在读截止年、人生时间线、年收入
    regionMod:r, talents:[], certs:[], titleLevel:0, studyUntil:null, timeline:[], annualIncome:0,
    // 事件系统：年度事件队列、当前职级在岗年数、额外事件冷却
    yearQueue:[], yearInRank:0, lastCertAge:null, lastTitleAge:null, lastHouseAge:null
  };
  pushLog(0,`出生于<b>${eraBornYear()}年</b>（${era}）的<b>${r.key}</b><b>${b.key}</b>家庭，性格底色是 <b>${mbti}·${MBTI_TYPES[mbti].name}</b>（${MBTI_TYPES[mbti].group}）。种子 <b>${seed}</b>。`);
  S.timeline.push({age:0,text:`出生于${eraBornYear()}年（${era}）的${r.key}${b.key}家庭`});
  return S;
}

/* ===================== 属性修改 ===================== */
// 属性统一上限 150（初始生成与后续变化共用）；名望（status）量纲不同，单独放宽到 200
const ATTR_CAP=150;
function add(k,d){
  if(k in S && typeof S[k]==="number"){
    const max=(k==="wealth"||k==="status"||k==="knowledge")?Infinity:ATTR_CAP;
    S[k]=Math.max(0,Math.min(max,S[k]+d));
  }
}
function addW(d){ S.wealth=Math.max(0,S.wealth+d); }

/* ===================== 事件属性增减幅度（统一放大） ===================== */
// 初始属性已下调，给成长留出空间；这里把每个「决策事件」带来的数值属性
// 属性变化统一放大（每次决策随机 1.5~3.5 倍），让选择更有分量、人生曲线更有起伏。
const SCALE_CAP=15;             // 单条属性单次变化上限，防止个别大数值事件失控
const SCALE_KEYS=["iq","eq","look","health","luck","happy","knowledge","status"];
function amplifyTurnDelta(before){
  // 每次决策的放大倍率随机（1.5~3.5）：增减幅度“随机但符合逻辑”，同种子同选择仍可复现
  const scale=1.5+rng()*2.0;
  SCALE_KEYS.forEach(k=>{
    let d=Math.round((S[k]-before[k])*scale);
    if(d===0) return;
    d=clamp(d,-SCALE_CAP,SCALE_CAP);
    const cap=(k==="status")?200:ATTR_CAP;
    S[k]=clamp(before[k]+d,0,cap);
  });
}

function applyTradeoff(before){
  const keys=["iq","eq","look","health","luck","happy","knowledge","status"];
  // 这次选择本就有属性取舍（有降有升）→ 不再叠加代价
  if(keys.some(k=>S[k]-before[k]<0)) return null;
  if(S.wealth<before.wealth) return null;
  // 找最大收益项（财富也参与比较：一夜暴富同样有隐性代价）
  let best=null,bestV=0;
  keys.forEach(k=>{ const d=S[k]-before[k]; if(d>bestV){best=k;bestV=d;} });
  const wd=(S.wealth||0)-(before.wealth||0);
  if(wd>bestV){best="wealth";bestV=wd;}
  if(!best) return null;
  const rule=TRADEOFF_RULES.find(r=>r.key===best);
  if(!rule || bestV<rule.minGain) return null;
  const c=pick(rule.costs);
  const cut=Math.max(1,Math.round(bestV*rule.rate));
  const cap=(c.attr==="wealth")?Infinity:ATTR_CAP;
  S[c.attr]=clamp(S[c.attr]-cut,0,cap);
  return `<span style="display:block;margin-top:6px;color:#b42318;">⚖ 代价：${c.txt}（${ATTR_NAMES[c.attr]||c.attr} −${cut}${c.attr==="wealth"?"万":""}）</span>`;
}

function mGaokao(){
  const regionKey=(S.regionMod?S.regionMod.key:"");
  const br=S.edu.branch||"理科";
  // —— 高考总分 750 制：语文150 数学150 英语150 综合300 ——
  // 现实逻辑：单科用“饱和曲线”计分——属性越高提升越慢，极限逼近但永远到不了满分
  //（天才也会失误），总分自然封顶在 700 出头；现实中 700+ 已是各省状元级别，
  // 750 满分自恢复高考以来从未有人考出过。
  // 科目能力映射：
  //   语文：学识+情商（阅读理解与表达）；数学：智商；英语：学识+努力（词汇语法积累）
  //   综合(300)：文理看智商+学识+努力；艺术生=文综基础+才艺资本(情商/颜值/学识)；
  //              体育生=文综基础+体魄(健康)
  // 学校平台（重点高中/重点初中加成）与临场发挥（运气小扰动）只做次要修正。
  const sat=(v)=>Math.tanh(v/95);
  const effort=(S.effort||0);
  const chinese = Math.round(150*(0.30+0.62*sat((S.knowledge+S.eq)/2)));
  const math    = Math.round(150*(0.30+0.62*sat(S.iq)));
  const english = Math.round(150*(0.30+0.62*sat((S.knowledge+effort*1.5)/2)));
  let compRaw;
  if(br==="艺术") compRaw = S.look*0.6 + S.eq*0.6 + S.knowledge*0.5;
  else if(br==="体育") compRaw = S.health*0.8 + S.knowledge*0.5;
  else compRaw = (S.iq + S.knowledge + effort*2)/3;
  const comprehensive = Math.round(300*(0.30+0.62*sat(compRaw)));
  const school = (S.edu.high==="重点高中"?30:S.edu.high==="普通高中"?10:0)+(S.edu.high==="重点初中"?8:0);
  let raw = chinese+math+english+comprehensive + school + (S.luck-50)*0.4 + R(-12,12);
  const score=clamp(Math.round(raw),150,740);
  S.gaokao=score;
  // 艺体生录取线折扣：现实中艺术/体育类录取 = 文化课 + 专业成绩折算，同档院校的文化课门槛
  // 明显低于普通类（艺术本科文化线约 300-380，普通类 450+；名校看综合分）。艺术按 78%、体育按 72% 折算。
  const tierDisc=(br==="艺术")?0.78:(br==="体育")?0.72:1;
  const tierLine=(t)=>Math.round((t.min+regionTierDelta(regionKey,t.name))*tierDisc);
  // 录取门槛随地区竞争烈度浮动：高考大省/一线门槛更高，西部/农村/县城因专项倾斜更易达线
  let tier=UNI_TIERS.find(t=>score>=tierLine(t));
  if(!tier) tier=UNI_TIERS[UNI_TIERS.length-1]; // 分数低于最低档（落榜）时回退到「专科/高职」用于展示
  const lineShown=tierLine(tier);
  S.edu.tier=tier.name;
  const opts=[];
  const passLine=Math.round((380+regionTierDelta(regionKey,"专科/高职"))*tierDisc);
  // 过线（专科线以上）：按分数对应真实院校
  if(score>=passLine){
    let pool=[...schoolListFor(tier,S.edu.branch)]; let schools=[];
    for(let i=0,n=Math.min(4,pool.length);i<n;i++) schools.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);
    schools.forEach(u=>opts.push({
      label:`报考 ${u}`, sub:tier.name+" · 录取线≈"+lineShown,
      stay:true,
      ef:()=>{
        S.edu.uni=u;
        S.edu.level=(score>=Math.round((450+regionTierDelta(regionKey,"二本院校"))*tierDisc)?"本科":"专科");
        S.pending={type:"major", age:S.age};
      },
      res:`你填报了 ${u}，达到录取线，顺利入围。`
    }));
    opts.push({label:"复读冲更好的学校",sub:"放弃今年录取，明年再战",ef:()=>{S.flags.retake=true;S.effort+=R(3,8);S.knowledge+=R(2,6);},res:"你不满足于眼前的录取，决定复读一年，向更心仪的大学发起冲击。"});
  }
  // 落榜（专科线以下）：复读 / 高职 / 就业
  if(score<passLine){
    opts.push({label:"复读再战",sub:"赌一年，明年再考",ef:()=>{S.flags.retake=true;S.effort+=R(3,8);S.knowledge+=R(2,6);},res:"你决定复读一年，把不甘咽进肚子里。"});
    opts.push({label:"读高职/技校",sub:"学一门手艺",stay:true,ef:()=>{S.edu.level="专科";S.edu.uni=pick(schoolListFor(UNI_TIERS.find(t=>t.name==="专科/高职"),S.edu.branch||"文科"));S.studyUntil=21;S.pending={type:"major",age:S.age};},res:"你进入高职院校，决定靠手艺吃饭。"});
    opts.push({label:"直接就业",sub:"进厂/学徒/个体",stay:true,ef:()=>{S.edu.level="高中";S.pending={type:"grad2",dir:"job_high",age:S.age};},res:"你放下书包，早早踏入社会。"});
  }
  const comp=(REGION_COMPETE[regionKey]!=null)?REGION_COMPETE[regionKey]:0;
  const compTxt = comp>0.6?"·本地区高考竞争极烈，录取线偏高":comp>0?"·本地区升学略卷":comp<-0.3?"·本地区（专项倾斜）录取线偏低":"";
  return {icon:"uni",title:"十八岁 · 高考",stage:"求学 · 大考",
    narr:`高考放榜：你考了 <b>${score}</b> 分${score<passLine?"，未过专科线":""}（${tier.name}档次${compTxt}）。十二年的书，先选一条路。`,
    opts};
}
function mGaokaoRetry(){
  // 复读后的第二次高考：成绩在原有基础上提升
  const boost=R(20,80);
  const gain = chance((S.iq+S.luck+S.effort)/180) ? boost : Math.round(boost*0.3);
  let score=clamp((S.gaokao||0)+gain,150,740);   // 上限 740：与首考一致，总分永远到不了 750
  S.gaokao=score;
  let tier=UNI_TIERS.find(t=>score>=t.min);
  if(!tier) tier=UNI_TIERS[UNI_TIERS.length-1]; // 复读后仍未过线时回退到「专科/高职」用于展示
  S.edu.tier=tier.name;
  if(score>=380){
    let pool=[...schoolListFor(tier,S.edu.branch)]; let schools=[];
    for(let i=0,n=Math.min(4,pool.length);i<n;i++) schools.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);
    const opts=schools.map(u=>({
      label:`报考 ${u}`, sub:tier.name,

    ]};

function mPickMajor(){
  const branch=S.edu.branch||"理科";
  const base=(MAJORS_BY_BRANCH[branch]||MAJORS_BY_BRANCH["理科"]);
  // 文理兼收专业：文理都能报；艺术/体育专业只开放对应方向（专业与方向对牢）
  let pool=[...new Set([...base, ...((branch==="艺术"||branch==="体育")?[]:MAJORS_BOTH)])];
  let majors=[];
  for(let i=0,n=Math.min(4,pool.length);i<n;i++) majors.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);
  return {icon:"book",title:"十八岁 · 选专业",stage:"求学 · 定向",
    narr:`你被 <b>${S.edu.uni}</b>（${S.edu.tier||""}）录取。结合你${branch==="理科"?"理科":branch==="文科"?"文科":branch==="艺术"?"艺术":"体育"}的底子，这些专业更对路：`,
    opts:majors.map(m=>{
      const isArt=ART_MAJORS.includes(m);
      const isSport=SPORT_MAJORS.includes(m);
      const okArt=!isArt || (hasArtTalent()||S.look>=70);
      const okSport=!isSport || (hasSportTalent()||S.health>=70);
      const sub = isArt?(okArt?"艺术方向":"跨度大·需补基础"):isSport?(okSport?"体育方向":"跨度大·需补基础"):(branch+"方向");
      return {label:`攻读 ${m}`, sub,
        ef:()=>{
          S.edu.major=m;
          if(isArt){ S.knowledge += okArt?8:3; if(!okArt)S.knowledge-=R(2,6); }
          else if(isSport){ S.knowledge += okSport?8:3; if(!okSport)S.knowledge-=R(2,6); }
          else S.knowledge+=R(10,22);
          S.timeline.push({age:S.age,text:`考入${S.edu.uni}，攻读${m}`});
        },
        res:isArt?(okArt?`你进入 ${S.edu.uni} 的${m}专业，四年青春就此展开。`:`你没有艺术底子却选了${m}，起步吃了些苦，但咬牙补了上来。`):isSport?(okSport?`你进入 ${S.edu.uni} 的${m}专业，把体魄与学业一起练强。`:`你没有体育底子却选了${m}，起步吃了些苦，但咬牙补了上来。`):`你进入 ${S.edu.uni} 的${m}专业，四年青春就此展开。`};
    })};
}
function careerLock(key){
  const lvl=S.edu.level;
  const uni=["本科","硕士","博士","海归硕士"];
  const adv=["硕士","博士","海归硕士"];
  switch(key){
    case "公务员": return uni.includes(lvl);
    case "事业单位": return uni.includes(lvl)||lvl==="专科";
    case "军人": return true;
    case "国企": return uni.includes(lvl)||lvl==="专科";
    case "互联网": return uni.includes(lvl);
    case "金融": return uni.includes(lvl);
    case "制造业": return uni.includes(lvl)||lvl==="专科";
    case "工人": return lvl==="高中"||lvl==="职高"||lvl==="专科";
    case "服务业": return lvl==="高中"||lvl==="职高"||lvl==="专科";
    case "自由职业": return true;
    case "演艺明星": return lvl==="高中"||lvl==="专科"||uni.includes(lvl);
    case "体育竞技": return lvl==="高中"||lvl==="职高"||lvl==="专科"||uni.includes(lvl);
    case "创业": return true;
    case "医生": return uni.includes(lvl);
    case "教师": return uni.includes(lvl)||lvl==="专科";
    case "警察": return uni.includes(lvl)||lvl==="专科";
    case "学术科研": return adv.includes(lvl);
  }
  return true;
}

      pickG.forEach(g=>{

        opts.push({label:`自费赴${g.country} · ${u}`,sub:"看家底",ef:()=>{S.wealth+=R(10,22);S.pending={type:"gradMajor",age:S.age,school:u,tier:g.country+"·自费",abroad:true};},res:`家里掏钱供你远赴${g.country}的${u}读书，开阔了眼界。`});
      });
    }
    opts.push({label:"放弃留学·直接就业",sub:"条件不足或不想去",ef:()=>{S.pending={type:"grad2",dir:"job",age:S.age};},
      res:(!canPublic&&!canSelf)?"你够不上留学门槛，决定先工作赚钱。":"你打消了留学念头，准备先工作。"});
    return {icon:"uni",title:`${S.age}岁 · 留学方向`,stage:"人生 · 定向",
      narr:"留学分两条路：成绩拔尖可走公派（免学费），家底厚可走自费——",opts};
  }
  if(dir==="startup"){
    return {icon:"briefcase",title:`${S.age}岁 · 创业方向`,stage:"人生 · 定向",
      narr:"创业也要选赛道，你看好哪一行？",
      opts:[
        {label:"科技/互联网创业",sub:"高成长",ef:()=>{enterCareer("创业");addW(-15);},then:evBizStart,res:"你扎进科技创业，先拉起队伍。"},
        {label:"消费/服务创业",sub:"接地气",ef:()=>{enterCareer("创业");addW(-12);},res:"你开了家小店/工作室，服务邻里。"},
        {label:"文创/自由职业起步",sub:"看才华",ef:()=>{enterCareer("自由职业");S.knowledge+=R(2,6);},res:"你以自由职业者身份，先接活养梦。"}
      ]};
  }
  // job
  const opts=[];
  const add=(label,key,sub,res,extraFn,thenEv)=>{
    if(!careerLock(key))return;
    if(!majorAllows(key))return;   // 专业对口筛选
    const o={label,sub,ef:()=>{enterCareer(key);if(extraFn)extraFn();},res};
    if(thenEv)o.then=thenEv;
    opts.push(o);
  };
  add("互联网大厂","互联网","高薪·高压","你杀进互联网大厂，代码写得飞起。");
  add("金融行业","金融","高薪·资源","你进了金融机构，与资本共舞。");
  add("制造业/实体","制造业","扎实·稳健","你进入实体企业，从基层做起。");
  add("自由职业/创作","自由职业","看才华","你选择靠才华和热爱吃饭。");
  if(canActCareer()) add("进军演艺圈","演艺明星","看颜值与才艺","你签了公司，从练习生做起，朝聚光灯走去。");
  if(canSportCareer()) add("走竞技体育","体育竞技","看体魄与天赋","你进入专业队，从青训队员做起，朝领奖台冲刺。");
  add("进厂当工人","工人","稳定·靠手艺","你进厂学手艺，靠技术吃饭。");
  add("做销售/服务业","服务业","门槛低·锻炼人","你进了服务业，从基层做起。");
  return {icon:"briefcase",title:`${S.age}岁 · 就业方向`,stage:"人生 · 定向",
    narr:"直接就业，选哪个行业？专业对口会更顺。",opts};
}
function mGradMajor(school,tierLabel,isAbroad){
  const branch=S.edu.branch||"理科";
  const base=(MAJORS_BY_BRANCH[branch]||MAJORS_BY_BRANCH["理科"]);
  // 专业必须与方向对牢：艺体只读艺体专业，文理兼收专业不开放给艺体
  const pool=[...new Set([...base, ...((branch==="艺术"||branch==="体育")?[]:MAJORS_BOTH)])];
  let majors=[]; for(let i=0,n=Math.min(4,pool.length);i<n;i++) majors.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);
  return {icon:"book",title:`${S.age}岁 · 读研选专业`,stage:"求学 · 定向",
    narr:`你已被 <b>${school}</b>（${tierLabel}）录取${isAbroad?"，即将远赴海外":""}。结合你${branch}的底子，选个方向：`,
    opts:majors.map(m=>({label:`攻读 ${m}${isAbroad?"（海外）":""}`,sub:branch+"方向",
      ef:()=>{
        S.edu.major2=m; S.edu.uni=school;
        if(isAbroad){ S.abroad=true; S.grad="海归"; S.edu.level="海归硕士"; S.knowledge+=R(8,18); }
        else { S.grad="硕士"; S.edu.level="硕士"; S.knowledge+=R(8,18); }
        S.flags.kaoyan2=false;
        // 读研通常 2-3 年，留学 1-2 年，根据当前年龄动态计算毕业年份
        const studyYears=isAbroad?2:2+R(0,1);
        const gradAge=S.age+studyYears;
        S.studyUntil=gradAge;
        S.pending={type:"gradDone",deg:isAbroad?"海归":"硕士",age:gradAge};
        S.timeline.push({age:S.age,text:`考入${school}，攻读${m}`});
      },
      res:`你入读 ${school} 的${m}，把方向定了下来。`}))};
}
function mPendingGrad(type){
  S.studyUntil=null;  // 学业完成，恢复正常工作/生活事件
  if(type==="硕士"){S.edu.level="硕士";}
  else if(type==="博士"){S.edu.level="博士";}
  else if(type==="海归"){S.edu.level="海归硕士";}
  else if(type==="本科"){S.edu.level="本科";}
  const tlabel = type==="硕士"?"硕士毕业": type==="博士"?"博士毕业": type==="本科"?"专升本毕业":"留学归来";
  const tdesc = type==="硕士"?"硕士读完了": type==="博士"?"博士读完了": type==="本科"?"两年本科读完了":"学成归国";
  const extra = type==="硕士"?()=>{S.status+=R(8,18);}
    : type==="博士"?()=>{S.status+=R(12,26);S.knowledge+=R(10,22);}
    : type==="本科"?()=>{S.status+=R(4,10);S.knowledge+=R(6,14);}
    : ()=>{S.wealth+=R(20,42);S.status+=R(5,12);};
  // 还没选过就业城市：先选城市再定职业（读研/留学归来同样要落脚）
  if(!S.city){
    S._afterCity={type:"gradDone",deg:type};
    return mCity();

  return {icon:(type==="海归"?"uni":"briefcase"),title:`${S.age}岁 · ${tlabel}`,stage:"人生 · 再选择",
    narr:`${tdesc}。你的学识更厚实了，见识也更广，接下来的路怎么走？`,
    opts:careerOpts(extra,"")};

/* ===================== 进入职业 ===================== */
// 通用"去企业打工"：按专业映射到细分职业（保证专业对口/跨专业逻辑仍生效）
function corpKey(){
  const m=S.edu.major2||S.edu.major;
  const map={
    "计算机":"互联网","软件工程":"互联网","电子信息":"互联网","视觉设计":"互联网",
    "自动化":"制造业","机械工程":"制造业",
    "临床医学":"事业单位","建筑学":"国企","师范":"事业单位",
    "金融学":"金融","经济学":"金融","会计学":"金融",
    "工商管理":"国企","新闻传播":"事业单位","汉语言文学":"公务员","法学":"公务员"
  };
  if(map[m]) return map[m];
  // 低学历无专业对口：服务业/工人兜底
  if(["高中","职高"].includes(S.edu.level)) return chance(0.5)?"服务业":"工人";
  if(S.edu.level==="专科") return "制造业";
  return "制造业";
}
function enterCareer(key){
  const c=CAREERS[key];
  S.career=key; S.track=c.track; S.rankIdx=0; S.rank=c.ranks[0];
  S.careerStartAge=S.age; S.yearInRank=0;
  S.salary=salaryWithCerts(); S.retired=false;
  // 专业对口加成 / 跨专业不确定性（研究生阶段 major2 优先）
  const major=S.edu.major2||S.edu.major;
  const related = major ? (MAJOR_CAREER_MAP[major]||[]) : [];
  S.majorFit = related.includes(key);
  if(S.majorFit){
    S.salary=Math.round(S.salary*1.10);
    S.status+=R(3,8); S.knowledge+=R(2,6);
    pushLog(S.age,`专业对口【${major}】→【${key}】，起薪与发展更顺。`);
  } else if(major){
    S.salary=Math.round(S.salary*0.95);
    pushLog(S.age,`跨专业进入【${key}】，起步略吃力，多了份不确定性。`);
  }
  if(c.track==="体制内"||c.track==="事业"||c.track==="国企"||c.track==="军队") S.status+=R(4,10);
  // 特长与职业方向契合，给点加成（影响事业）
  const tmap={art:["自由职业","创业"],sport:["体制内","事业","军队"],academic:["互联网","金融","学术科研","国企"]};
  const hints=S.talents.map(talentObj).filter(Boolean).map(t=>t.type);
  if(hints.includes("art")&&tmap.art.includes(key)){ S.salary=Math.round(S.salary*1.05); S.status+=R(1,4); }
  if(hints.includes("academic")&&tmap.academic.includes(key)){ S.knowledge+=R(2,6); S.status+=R(1,4); }
  if(hints.includes("sport")&&tmap.sport.includes(key)){ S.health+=R(1,4); S.eq+=R(1,4); }
  if(key==="演艺明星") S.flags.actor=true;     // 标记演艺职业，触发专属事件链
  if(key==="体育竞技") S.flags.athlete=true;   // 标记运动员职业，触发专属事件链
  pushLog(S.age,`进入【${key}】赛道，任职 <b>${S.rank}</b>，月薪约 ¥${S.salary.toLocaleString()}${S.city?`，在 ${S.city} 落脚`:""}。`);
  S.timeline.push({age:S.age,text:`入职${key}·${S.rank}`});
  // 若已结婚，按“实际职业”重算配偶家庭背景的职业加成——避免“先成家后立业”时加成在结婚时被算丢
  if(S.spouse){ S.spouseCareerBonus=computeSpouseCareerBonus(S.spouse.family, key); }
}

/* ===================== 职业晋升与收入（每年） ===================== */
function careerTick(){
  if(!S.career)return;
  const c=CAREERS[S.career];
  // 退休：体制内/国企/事业/军队（含医生/教师/警察）按规定退休
  // 60岁前到副部级(职级idx7)延至63岁，63岁前到正部级/顶级(idx8)延至65岁——干部任期惯例
  const PUB_TRACK={体制内:1,国企:1,事业:1,军队:1};
  if(!S.retired && PUB_TRACK[S.track] && S.age>=60 && S.career){  // 退休年龄统一为60岁
    let ra=60;
    if(S.rankIdx>=7 && S.age<63) ra=63;
    if(S.rankIdx>=8 && S.age<65) ra=65;
    if(S.age>=ra){
    S.retired=true;
    S.salary=Math.round(S.salary*0.55);
    pushLog(S.age,`正式退休${ra>60?"（高级别延退）":""}，开始领取养老金，月约 ¥${S.salary.toLocaleString()}。`);
    S.notables.push({text:"光荣退休，开启人生下半场", icon:"briefcase"});
    }
  }
  // 运动员黄金期短，36 岁前后退役转型（与体制内 60 岁退休区分开）
  const EARLY_RETIRE={体育:36};
  if(!S.retired && EARLY_RETIRE[S.track] && S.age>=EARLY_RETIRE[S.track]){
    S.retired=true;
    S.salary=Math.round(S.salary*0.5);
    pushLog(S.age,`运动生涯告一段落，你开始转型，月约 ¥${S.salary.toLocaleString()}。`);
    S.notables.push({text:"退役转型，开启人生下半场", icon:"trophy"});
  }
  // 其余轨道的默认退休年龄：此前企业/创业/自由/学术/蓝领/服务永远不退休（干到去世都没有养老金），属明显漏洞。
  // 现实逻辑：企业/蓝领/服务 60 岁退休；学术（教授）延至 65；创业/自由职业弹性大，65/68 岁淡出
  const OTHER_RETIRE={企业:60,蓝领:60,服务:60,学术:65,创业:65,自由:68};
  if(!S.retired && OTHER_RETIRE[S.track]!=null && S.age>=OTHER_RETIRE[S.track]){
    S.retired=true;
    S.salary=Math.max(1,Math.round(S.salary*0.55));
    pushLog(S.age,`到了${OTHER_RETIRE[S.track]}岁，你正式退休，开始领取养老金，月约 ¥${S.salary.toLocaleString()}。`);
    S.notables.push({text:"光荣退休，开启人生下半场", icon:"briefcase"});
  }
  if(S.retired) S.status=Math.min(100,S.status+0.5);
  // 年度收入（元）
  let annual=S.salary*12;
  let bonusMonths;
  const tr=S.track;
  if(S.retired){
    bonusMonths = 0;                        // 退休后只领固定养老金，不再有年终奖/绩效
  } else if(tr==="企业"){
    bonusMonths = (c.mgmtFrom && S.rankIdx>=c.mgmtFrom) ? (6+rng()*6) : (2+rng()*2);
  } else if(tr==="创业"){
    bonusMonths = (rng()*22 - 4);            // 可能为负（亏损），但成功时上限极高
  } else if(tr==="自由"){
    bonusMonths = (rng()*10);
  } else if(tr==="国企"){
    bonusMonths = 2 + S.rankIdx*0.4 + rng()*1.5;
  } else if(tr==="体制内"||tr==="事业"||tr==="军队"){
    bonusMonths = 1 + S.rankIdx*0.3 + rng()*0.8;   // 随级别稳步增加
  } else if(tr==="学术"){
    bonusMonths = 1 + S.rankIdx*0.4 + rng()*1.0;
  } else if(tr==="体育"){
    bonusMonths = (rng()*14 - 2);            // 体育：奖金/代言波动大，平淡年甚至略亏
  } else { bonusMonths = 1; }
  // 跨专业：收入多一份不确定性（波动更大）
  if(!S.majorFit) bonusMonths *= (0.85 + rng()*0.30);
  // 突发事件标记：风口顺风、寒冬收缩
  if(S.flags && S.flags.boom) bonusMonths *= 1.25;
  if(S.flags && S.flags.crisis) bonusMonths *= 0.8;
  // 商贾/干部家庭的配偶带来资源，年收入更厚
  if(S.spouse && (S.spouse.family==="商贾之家"||S.spouse.family==="干部家庭")) bonusMonths += 0.25;
  // 配偶家庭背景带来的职业加成（已在结婚时计算）
  if(S.spouseCareerBonus){
    if(S.spouseCareerBonus.income) bonusMonths += S.spouseCareerBonus.income;
    if(S.spouseCareerBonus.wealth) addW(S.spouseCareerBonus.wealth);
    if(S.spouseCareerBonus.flag) S.flags[S.spouseCareerBonus.flag]=true;
  }
  annual += S.salary*bonusMonths;
  // 收入倍率：就业后按「就业城市」算，没选过城市（一直在读书/退役后）才退回出生地
  const regionMul = (S.cityMod && S.cityMod.salaryMul) ? S.cityMod.salaryMul : ((S.regionMod && S.regionMod.salaryMul) ? S.regionMod.salaryMul : 1);
  annual = Math.round(annual);   // 城市系数已在 salaryWithCerts 内计入（cityMul），此处不再重复相乘
  // 记录年收入（用于结算页“月均收入”展示）
  S.annualIncome = annual;
  // 支出（万/年）：随城市消费水平、婚姻、子女、房贷浮动，并随收入水涨船高（更贴近现实）
  const rm=(S.cityMod && S.cityMod.consumeMul)?S.cityMod.consumeMul:((S.regionMod && S.regionMod.salaryMul)?S.regionMod.salaryMul:1);   // 近似城市消费水平（就业城市优先）
  let living=(S.spouse?5.0:2.8)*rm;                       // 成家后家庭基础开支明显上升
  living += S.children*2.6*rm;                            // 每个孩子：养育+教育约 2.6 万/年
  if(S.hasHouse && S.mortgage && S.mortgageEndAge && S.age<=S.mortgageEndAge) living += S.mortgage;  // 房贷月供折算年支出
  living += Math.max(0, annual/10000)*0.16;               // 收入越高，消费性支出也越高（防止高收入囤积失真）
  const expense = living;
  const incomeW = annual/10000;
  S.wealth = Math.max(0, S.wealth + (incomeW - expense));
  // 记录年度收支（万），供状态栏展示“年支出 / 每年财富结余”
  S.annualExpense = Math.round(expense*100)/100;
  S.annualSurplus = Math.round((incomeW - expense)*100)/100;
  // 晋升
  S.yearInRank = (S.yearInRank||0) + 1;
  if(!S.retired && S.rankIdx < c.ranks.length-1 && S.yearInRank>=Math.max(2,S.rankIdx+1) && chance(promotionChance(tr,c))){
    S.rankIdx++; S.rank=c.ranks[S.rankIdx];
    S.yearInRank=0;
    S.salary=salaryWithCerts();
    S.status+=R(3,7); S.happy+=R(2,6);
    pushLog(S.age,`晋升为 <b>${S.rank}</b>！月薪涨到约 ¥${S.salary.toLocaleString()}。`);
    // 同时记入时间线（带真实年龄），保证结算页“主要事件”里精确呈现提拔时间点
    S.timeline.push({age:S.age, text:`晋升为 ${S.rank}（${S.career}）`});
    S.notables.push({age:S.age, text:`晋升为 ${S.rank}（${S.career}）`, icon:"medal"});
    if(S.rankIdx===c.ranks.length-1){
      if(tr==="体制内") addTitle("位极人臣");
      if(tr==="企业") addTitle("商界巨擘");
      if(tr==="创业") addTitle("商业巨头");
      if(tr==="学术") addTitle("学界泰斗");
      if(tr==="国企") addTitle("国企栋梁");
    }
  }
  // 挫折（运气差时；体制内/事业/军队更稳）- 下调挫折概率，降低降级风险
  const riskBase = (tr==="体制内"||tr==="事业"||tr==="军队")?0.012:0.02; // 从0.03/0.06降至0.012/0.02
  if(chance((100-S.luck)/100*riskBase)){
    let bad=pick(["考核不理想，被领导约谈","卷入小风波，口碑受损","项目受挫，锅背在了你身上"]);
    S.happy-=R(1,3); S.status=Math.max(0,S.status-R(1,2));
    // 仅创业/自由职业可能降级，且需至少3级才能降，体制内/事业/军队不降级
    if((tr==="创业"||tr==="自由")&&chance(0.15)&&S.rankIdx>=2){S.rankIdx-=1;S.rank=c.ranks[S.rankIdx];S.salary=salaryFor(S.career,S.rankIdx);bad+="，职级还滑了下来";}
    pushLog(S.age,`职场波折：${bad}。`);
  }
}
function addTitle(t){ if(!S.titles.includes(t)) S.titles.push(t); }

// —— 职业晋升的“属性偏好”：不同行业看重不同能力（现实逻辑） ——
// 权重 × 属性值（0~100）累加进晋升评分；权重越大，该属性对晋升越重要。
// 例：体制内/国企重情商与人脉（eq/status 高权重），学术重智商学识（iq/know），
//     运动员/军人/工人吃身体（health），演艺吃颜值（look），创业吃运气与胆识（luck），
//     销售服务业吃情商与亲和力（eq/look）。没单列的行业按轨道兜底。
const PROMO_W_CAREER={
  "公务员":  {iq:.07,know:.10,eq:.13,look:.02,health:.03,luck:.03,status:.07},
  "警察":    {iq:.08,know:.07,eq:.10,look:.02,health:.16,luck:.04,status:.08},
  "国企":    {iq:.08,know:.10,eq:.12,look:.02,health:.04,luck:.03,status:.06},

// 综合晋升评估：把个人属性、学历、证书、职称、关键事件选择、配偶、资历、年龄、行业基准综合成提拔概率
function promotionChance(tr,c){
  const lvl=S.edu.level||"未定";
  const uni=["本科","硕士","博士","海归硕士"];
  const adv=["硕士","博士","海归硕士"];
  // 1) 个人属性：按职业/轨道的“属性偏好”加权（行业不同，晋升看重的素质不同）
  const w=PROMO_W_CAREER[S.career]||PROMO_W_TRACK[tr]||{iq:.10,know:.10,eq:.10,look:.03,health:.05,luck:.06,status:.05};
  let score=0;
  score += S.iq*w.iq + S.knowledge*w.know;   // 能力：智商/学识（学术、互联网最看重）
  score += S.eq*w.eq;                        // 人际：情商（体制内/国企/服务业最看重）
  score += S.look*w.look;                    // 形象：颜值（演艺/服务/自由职业）
  score += S.health*w.health;                // 身体：健康（军人/运动员/工人）
  score += S.luck*w.luck;                    // 运气：时运（创业/演艺/金融）
  score += S.status*w.status;                // 名望：积累的口碑与位置（体制内）
  score += (S.happy-50)*0.04;              // 心情：长期愉悦者更稳更得人缘，低落者晋升亦受影响
  // 1b) 就业城市加成：一线城市机会多晋升快，老家/县城空间小（现实逻辑）
  if(S.cityMod && S.cityMod.promoBonus) score += S.cityMod.promoBonus;
  // 2) 学历：按职业差异化——艺体吃天赋不吃文凭；公务员/互联网/金融/医生/律师等精英行业，
  //    专科与高中的学历加成为 0（现实：这些行业的提拔门槛就是本科起步）；服务业学历溢价低
  let eduBonus;
  const zeroLowEdu=["公务员","互联网","金融","医生","律师","警察"].includes(S.career);
  if(S.career==="演艺明星"||S.career==="体育竞技"){
    eduBonus=0;                                        // 演艺/体育：文凭几乎不影响上位
  } else if(zeroLowEdu){
    eduBonus = uni.includes(lvl) ? (lvl==="本科"?5:(lvl==="硕士"?9:12)) : 0;   // 非本科一律 0 分（下调）
  } else if(S.career==="服务业"||S.career==="自由职业"){
    eduBonus = uni.includes(lvl) ? (lvl==="本科"?3:(lvl==="硕士"?5:6)) : (lvl==="专科"?1:0);  // 下调
  } else {
    eduBonus = uni.includes(lvl) ? (lvl==="本科"?5:(lvl==="硕士"?9:12)) : (lvl==="专科"?2:0);  // 其他行业高中也归零（下调）
    if(S.career==="学术科研") eduBonus+=3;             // 学术圈：高学历是硬通货（下调）
  }
  score += eduBonus;
  // 3) 证书与职称：硬实力，直接折算成提拔加分
  score += S.certs.reduce((s,x)=>s+((CERTS.find(o=>o.key===x)||{}).promo||0)*100,0);
  score += S.titleLevel*3;
  // 4) 关键事件选择：进修/基层历练/站队/贵人相助/力挽狂澜/老板赏识/廉洁口碑/带人/风口借势（或寒冬拖累）
  if(S.flags.studyWork) score+=6;
  if(S.flags.grassroots) score+=6;
  if(S.flags.politicsWon) score+=5;
  if(S.flags.patron) score+=6;
  if(S.flags.saved) score+=8;
  if(S.flags.bossDoor) score+=5;
  if(S.flags.clean) score+=4;
  if(S.flags.coach) score+=3;
  if(S.flags.mentor) score+=2;
  if(S.flags.stage) score+=2;      // 舞台历练：艺体底子
  if(S.flags.star) score+=8;       // 演艺成名：明星路的核心
  if(S.flags.champion) score+=8;   // 体育夺冠：运动员路的核心
  if(S.flags.model) score+=4;      // 技术能手/劳模：蓝领晋升资本
  if(S.flags.best) score+=3;       // 业绩冠军：服务业晋升资本
  if(S.flags.hit) score+=4;        // 技术突破/爆款：互联网晋升资本
  if(S.flags.bull) score+=4;       // 踩中牛市：金融晋升资本
  if(S.flags.boom) score+=3;
  if(S.flags.crisis) score-=3;
  if(S.flags.xuandiao) score+=8;   // 选调生：组织重点培养，晋升通道更快
  // 4c) 政治面貌：党员在体制内/国企/军队是晋升硬通货，显著加分；其他行业略加
  if(S.flags.party){
    if(tr==="体制内"||tr==="国企"||tr==="军队") score+=4;   // 党员加分（再下调至4分）
    else score+=1;
  }
  // 5) 专业对口：科班出身走得更顺
  score += S.majorFit?4:0;
  // 6) 配偶助力：家庭背景与职业赛道的精准匹配（现实：不同家庭带来不同资源）
  if(S.spouse && S.spouseCareerBonus && S.spouseCareerBonus.promo){
    score += S.spouseCareerBonus.promo;
  }
  // 6b) 性格适配：性格与职业赛道对路者晋升更顺，错配者受阻（现实：行事风格与岗位要求匹配度影响发展）
  if(S.mbti){
    const mb=mbtiCareerBonus(S.mbti, S.career);
    if(mb) score += mb;
  }
  // 7) 职级越高越难爬（二次曲线：越往上越陡）——这是现实里“越往顶层越挤”的核心约束
  score -= S.rankIdx*S.rankIdx*0.7;
  // 8) 年龄曲线：35-50 黄金期，越老越难
  if(S.age>=35&&S.age<=50) score+=4;
  else if(S.age>50) score-=Math.max(0,(S.age-50))*1.5;
  // 8b) 高层年龄硬门槛：副厅级(职级idx≥5)需≥45岁、正厅级(职级idx≥6)需≥52岁，杜绝“年少高位”
  if(S.rankIdx>=5 && S.age<45) score*=0.30;
  if(S.rankIdx>=6 && S.age<52) score*=0.18;
  // 8c) 职业现实硬约束：
  //    运动员——上位靠成绩说话：国家队主力以上必须有冠军头衔或顶级名望，30 岁后状态断崖
  if(S.career==="体育竞技"){
    if(S.rankIdx>=5 && !(S.flags.champion||S.status>=65)) score*=0.25;   // 主力以上：无冠军且名望不足 → 基本没戏
    if(S.rankIdx>=7 && !S.flags.champion) score*=0.20;                   // 世界冠军级：必须夺冠
    if(S.age>=30) score*=0.75;                                           // 30 岁身体开始走下坡
    if(S.age>=34) score*=0.60;                                           // 34 岁接近退役线，几乎不再上台阶
  }
  //    艺人——上位靠成名与国民度：一线之前必须先"红"，中老年戏路收窄（低龄出道有红利）
  if(S.career==="演艺明星"){
    if(!S.flags.star) score*=0.70;                                       // 未成名前整体压低：圈内大多数人熬不出头
    if(S.rankIdx>=6 && !S.flags.star) score*=0.25;                       // 一线明星必须先成名（star 标记）
    if(S.rankIdx>=7 && S.status<70) score*=0.50;                         // 顶级流量需要国民度支撑
    if(S.age>=45) score*=0.70;                                           // 中年后戏路收窄
    if(S.age<22) score*=1.20;                                            // 低龄出道红利期
  }
  // 9) 在岗资历不足：刚上任的头几年基本不提拔
  const minYears=Math.max(2,S.rankIdx+1);   // 与冷冻期一致：级别越高，资历要求越久
  if(S.yearInRank<minYears) score*=0.15;
  // 10) 高阶层硬性门槛：学历不达标，提拔基本无望
  if(tr==="体制内"&&S.rankIdx>=3&&!uni.includes(lvl)) score*=0.25;
  if(tr==="事业"&&S.rankIdx>=2&&!uni.includes(lvl)) score*=0.25;
  if(tr==="学术"&&S.rankIdx>=2&&!adv.includes(lvl)) score*=0.2;
  // 11) 行业基准：不同轨道的提拔节奏不一样（整体放缓，体制/国企/事业更看资历，创业/自由波动大）
  const baseByTrack={体制内:0.20,国企:0.22,事业:0.18,军队:0.20,企业:0.24,创业:0.20,自由:0.18,学术:0.20,蓝领:0.22,服务:0.20,体育:0.22}[tr]||0.20;
  // 12) 时代行业景气度：行业处在风口时晋升更易、机遇更多；处在下行期则相反（现实：大环境决定个人天花板）
  score += eraCareerBonus(S.career);
  let p=baseByTrack*(0.30 + score/130);   // 触底分数要求提高：同样的属性分换来的概率更低
  return clamp(p,0.006,0.30);             // 提拔最高概率封顶 30%
}

const EXC_ATTR=75;   // “超群”阈值
function exceptionalAttr(){
  // 返回当前最突出的超群属性键（≥阈值），否则 null
  const cand=[["iq",S.iq],["eq",S.eq],["look",S.look],["health",S.health],["status",S.status],["luck",S.luck]];
  cand.sort((a,b)=>b[1]-a[1]);

// 返回{promo:晋升加分, income:收入月数加成, wealth:一次性财富, flag:记录到S.flags}或null
function computeSpouseCareerBonus(family, career){
  if(!family) return null;
  const tr=career?CAREERS[career]?.track:null;
  const bonus={promo:0,income:0,wealth:0,flag:null};
  switch(family){
    case "干部家庭":
      // 体制内/国企/军队/事业：人脉资源直接助力晋升（最大加成）
      if(tr==="体制内"||tr==="国企"||tr==="军队"||tr==="事业"){
        bonus.promo=8; bonus.income=0.15; bonus.flag="spouseCadre";
      } else if(tr==="创业"||tr==="企业"){
        bonus.promo=3; bonus.income=0.08; bonus.flag="spouseNetwork";
      } else if(tr==="学术"||tr==="互联网"||tr==="金融"){
        bonus.promo=2; bonus.flag="spouseNetwork";
      }
      break;
    case "商贾之家":
      // 创业/金融/企业：资金+人脉双重支持（最大加成）
      if(tr==="创业"){
        bonus.promo=10; bonus.income=0.20; bonus.wealth=R(5,15); bonus.flag="spouseCapital";
      } else if(tr==="金融"||tr==="企业"){
        bonus.promo=6; bonus.income=0.15; bonus.wealth=R(3,8); bonus.flag="spouseCapital";
      } else if(tr==="互联网"||tr==="学术"){
        bonus.promo=3; bonus.income=0.10; bonus.flag="spouseCapital";
      }
      break;
    case "书香门第":
    case "教师家庭":
    case "医生世家":
      // 学术/事业/公务员：学识与名望加持（最大加成）
      if(tr==="学术"||tr==="事业"||tr==="公务员"){
        bonus.promo=8; bonus.income=0.08; bonus.flag="spouseIntellect";
      } else if(tr==="体制内"||tr==="国企"){
        bonus.promo=5; bonus.flag="spouseIntellect";
      } else if(tr==="医疗"||tr==="教育"){
        bonus.promo=6; bonus.income=0.05; bonus.flag="spouseIntellect";
      }
      break;
    case "军人家庭":
      // 军队/警察/执法系统：作风过硬加成（最大加成）
      if(tr==="军队"||tr==="警察"||tr==="体制内"){
        bonus.promo=7; bonus.income=0.10; bonus.flag="spouseDiscipline";
      } else if(tr==="安保"||tr==="消防"||tr==="国企"){
        bonus.promo=4; bonus.income=0.05; bonus.flag="spouseDiscipline";
      }
      break;
    case "海归家庭":
      // 互联网/金融/创业/学术：国际视野（最大加成）
      if(tr==="互联网"||tr==="金融"||tr==="创业"||tr==="学术"){
        bonus.promo=7; bonus.income=0.15; bonus.flag="spouseGlobal";
      } else if(tr==="企业"||tr==="事业"){
        bonus.promo=4; bonus.income=0.10; bonus.flag="spouseGlobal";
      }
      break;
    case "实业之家":
      // 制造业/实体企业/创业：务实作风+资金（最大加成）
      if(tr==="企业"||tr==="创业"||tr==="国企"){
        bonus.promo=7; bonus.income=0.12; bonus.wealth=R(3,10); bonus.flag="spousePragmatic";
      } else if(tr==="蓝领"||tr==="服务"){
        bonus.promo=3; bonus.income=0.08; bonus.flag="spousePragmatic";
      }
      break;
    case "艺术之家":
      // 自由职业/传媒创意：审美与人脉（最大加成）
      if(tr==="自由"||tr==="创业"||tr==="传媒"){
        bonus.promo=6; bonus.income=0.10; bonus.flag="spouseCreative";
      } else if(tr==="学术"||tr==="企业"){
        bonus.promo=3; bonus.income=0.05; bonus.flag="spouseCreative";
      }
      break;
    case "农户之家":
      // 蓝领/服务业/农业：踏实肯干（小加成）
      if(tr==="蓝领"||tr==="服务"||tr==="农业"||tr==="工人"){
        bonus.promo=3; bonus.income=0.06; bonus.flag="spouseGrounded";
      } else if(tr==="创业"){
        bonus.promo=2; bonus.income=0.04; bonus.flag="spouseGrounded";
      }
      break;
    case "小富之家":
      // 小生意起家，创业/服务业加分（小加成）
      if(tr==="创业"||tr==="服务"||tr==="自由"){
        bonus.promo=4; bonus.income=0.10; bonus.wealth=R(2,6); bonus.flag="spouseSmallBiz";
      } else if(tr==="蓝领"||tr==="服务"){
        bonus.promo=2; bonus.income=0.05; bonus.flag="spouseSmallBiz";
      }
      break;
    case "工薪之家":
      // 普通家庭：稳定但资源有限（微小加成）
      if(tr==="服务"||tr==="蓝领"||tr==="工人"){
        bonus.promo=2; bonus.income=0.04; bonus.flag="spouseStable";
      } else {
        bonus.promo=1; bonus.flag="spouseStable";
      }
      break;
  }
  return bonus.promo||bonus.income||bonus.wealth ? bonus : null;
}

};
function genPartner(name, biasFamilies){
  let f;
  if(biasFamilies && biasFamilies.length && chance(0.8)){
    const k=pick(biasFamilies);
    f = SPOUSE_FAMILIES.find(x=>x.key===k) || pick(SPOUSE_FAMILIES);
  } else {
    f = pick(SPOUSE_FAMILIES);
  }
  const edu=pick(f.eduPool);
  const look=clamp(R(40,88)+f.lookBias+R(-3,3),0,100);
  const capab=clamp(R(35,85)+f.lookBias,0,100);
  const tagline=pick(TRAIT_TAGLINE[f.trait]||["气质干净，让人看着就舒服"]);
  return {name, edu, family:f.key, famDesc:f.famDesc, look, trait:f.trait, tagline,
    statusB:f.statusB+R(-1,2), knowB:f.knowB+R(-1,2), wealthB:Math.max(0,f.wealthB+R(-3,8)), capab};
}
function makeSpouseCandidates(){
  const opp = S.gender==="F"?M_NAMES:F_NAMES;

  const n=(S.luck>55||S.status>30)?(S.luck>75||S.status>55?4:3):2;
  let chosen=[];
  for(let i=0;i<n;i++) chosen.push(genPartner(pick(opp)));
  // 保住与现任恋人的连续性：谈过恋爱的人结婚时沿用其家庭/学历背景，而非随机生成
  if(S.datingProfile) chosen.unshift(S.datingProfile);
  return chosen;
}

function relationEvent(){
  const opp = S.gender==="F"?M_NAMES:F_NAMES;
  const a=S.age;
  if(S.spouse){
    const cap=(S.wealth>200?4:2);
    // 生育年龄曲线：25~34 概率最高，35~40 递减，40 岁后大幅下降（符合现实，仍属随机触发）
    let rate=0;
    if(S.children<cap){
      if(a>=23&&a<=26) rate=0.16;
      else if(a>=27&&a<=32) rate=0.22;
      else if(a>=33&&a<=36) rate=0.14;
      else if(a>=37&&a<=40) rate=0.08;
      else if(a>=41&&a<=44) rate=0.04;
    }
    if(rng()<rate) return evHaveBaby(opp);
    return null;
  }
  if(S.dating){
    // 确定恋爱后，有概率触发分手事件
    if(a>=18 && a<=32 && rng()<0.12) return evBreakup();
    // 恋爱→结婚：默认与现任恋爱对象结婚（24~36 为高峰）
    if(a>=22 && a<=38){
      const r=a>=24&&a<=32?0.22:(a>=33&&a<=36?0.15:0.08);
      if(rng()<r) return evMarryDating();
    }
    if(a>=22 && a<=34 && rng()<0.12) return evDatingFriction(opp);
    if(a>=24 && a<=35 && rng()<0.10) return evLongDist(opp);
    return null;
  }
  // 单身：学生时代仅“属性超群”才心动，且吸引类型随超群属性而变
  if(a<=22){
    const dom=exceptionalAttr();
    if(dom && rng()<0.38) return evCrush(opp, dom);
    return null;
  }
  // 成年单身：社交相遇（工作圈/兴趣群）—— 性格影响主动性：外向者更常遇见人，内向者偏独处
  if(a>=20 && a<=26 && rng()<0.20*mbtiSocialChance(S.mbti)) return evMeet(opp);
  // 婚恋压力年龄：无恋爱对象 → 触发相亲（主要结婚路径）—— 判断型更早被催/更配合安排
  if(a>=25 && a<=42 && rng()<(a>=27&&a<=34?0.26:0.14)*mbtiSocialChance(S.mbti)) return evBlindDate(opp);
  return null;
}

      {label:"认真看世界",ef:()=>{S.knowledge+=R(1,3);},res:"你睁着大眼睛，把一切都看进心里。"},
      {label:"往怀里钻",ef:()=>{S.eq+=R(1,3);S.happy+=R(1,3);},res:"你撒着娇，被宠着慢慢长大。"}
    ],"baby");

  if(age<22){
    return autoEvt("日常 · 成长","又一年，你在课业与玩闹间悄悄长大。",[
      {label:"用功读书",ef:()=>{S.knowledge+=R(1,4);S.happy-=R(1,4);},res:"你多背了几个知识点，少玩了些。"},
      {label:"撒欢玩耍",ef:()=>{S.happy+=R(1,4);S.health+=R(1,4);},res:"你跑得满头大汗，睡得特别香。"},
      {label:"帮家里做事",ef:()=>{S.eq+=R(1,4);},res:"你学会了体谅大人，手脚也勤快了。"}

  return autoEvt("日常 · 平淡","又一年，日子不咸不淡地流过。",[

  ],"star");
}

// 通过率：基础通过率(含金量越高越低)为主，学识/智商做小幅修正（±25%）。
// 资历折扣：当前职业阶段未达到证书建议阶段时通过率打折——证书不锁死，但"逐步考"，
// 资历到位后把握自然上升（例：起步期硬考CFA极难，成熟期就水到渠成）。
function certPassRate(c, triesOverride){
  const base=(c.pass==null?0.5:c.pass);
  const adjust=(S.knowledge+S.iq-100)/400;   // 学识+智商高于100有加成，低于100打折
  let rate=base+adjust;
  // 重考加成：同一张证书每失败一次，下次通过率 +8%（最多 +25%）——熟能生巧
  const tries = triesOverride!=null ? triesOverride : ((S.certFails && S.certFails[c.key])||0);
  rate += Math.min(0.25, tries*0.08);
  const need=c.phase==null?0:c.phase;
  const got=careerPhase();
  if(got<need){
    const short=need-got;                     // 差几个阶段
    rate*=Math.max(0.25, 0.62-short*0.18);    // 差1档×0.44 / 差2档×0.26 / 差3档×0.25
  }
  return clamp(rate, 0.03, 0.92);
}
function certEvent(app){
  const picks=pickN(app, Math.min(2,app.length));
  const opts=picks.map(c=>{
    const tries=(S.certFails && S.certFails[c.key])||0;
    const rate=certPassRate(c);
    const ok=chance(rate);
    return {
      label:`考取 ${c.key}`, sub:`${c.desc} · 通过率约${Math.round(rate*100)}%${tries?`（第${tries+1}次报考，更有把握）`:""}`,
      ef:()=>{ if(ok){ S.certs.push(c.key); if(S.certFails) delete S.certFails[c.key]; S.knowledge+=c.know; S.salary=salaryWithCerts(); S.status+=R(1,4);
        pushLog(S.age,`考取【${c.key}】，专业力与身价再增厚。`); S.timeline.push({age:S.age,text:`考取${c.key}`}); }
        else { S.certFails=S.certFails||{}; S.certFails[c.key]=(S.certFails[c.key]||0)+1; S.knowledge+=R(2,6); pushLog(S.age,`【${c.key}】没考过，但啃下不少知识。`); } },
      res:ok?`你拿下 ${c.key}，在${S.career}路上多了块硬招牌。`:`这次差了一点，但你离它更近了。`
    };
  });
  opts.push({label:"暂不考证",ef:()=>{S.knowledge+=R(1,4);},res:"你把精力放在别处。"});
  return {rid:"x_cert",icon:"book",title:"职业 · 考证",stage:"人生 · 突发事件",
    narr:"行业里几张证书含金量不低，要不要啃下来？",opts};
}

function phaseLo(age){ return phaseOf(age)[0]; }
function phaseOf(age){
  if(age<=11) return [1,11];
  if(age<=16) return [12,16];
  if(age<=22) return [17,22];
  if(age<=59) return [23,59];
  return [60,100];
}
// —— 职业生涯阶段：按职级进度划分，让职业事件能在「对应阶段」触发 ——
// 0 起步（新人/入职初期） 1 成长（骨干/晋升爬坡） 2 成熟（中坚/资深）
// 3 巅峰（高层/顶尖） 4 暮年（守成/临近退休）
function careerPhase(){
  if(!S.career) return -1;
  const c=CAREERS[S.career];
  const n=c.ranks.length;
  const ratio=S.rankIdx/Math.max(1,n-1);   // 职级进度 0~1
  if(S.retired) return 4;
  if(ratio<=0.18) return 0;                 // 起步：最低职级及以下
  if(ratio<0.45) return 1;                  // 成长：中下段
  if(ratio<0.72) return 2;                  // 成熟：中上段
  if(ratio<0.95) return 3;                  // 巅峰：高层
  return 4;                                 // 暮年：顶端守成
}
function pickEvent(age,gender){
  const phLo=phaseLo(age);
  const ALL_EVENTS=EVENTS.concat(ERA_EVENTS);   // 把"时代专属事件"合并进主事件池，统一参与筛选
  const trackOk=e=>((!e.track||e.track.includes(S.track)) && (!e.career||e.career===S.career));
  const bgOk=e=>(!e.bg || e.bg===S.bg);
  const condOk=e=>(!e.cond || e.cond());
  // 职业阶段过滤：事件可限定在特定职业生涯阶段触发（如「新入职」只在起步期出现）
  const phaseOk=e=>{
    if(!e.phase) return true;
    if(!S.career) return false;
    const p=careerPhase();
    return e.phase.includes(p);
  };
  // 学科方向过滤：事件可限定文/理/艺体（选理科后不再出现文科专属事件，反之亦然）
  const branchOk=e=>{
    if(!e.branch) return true;
    if(Array.isArray(e.branch)) return e.branch.includes(S.edu.branch);
    if(typeof e.branch==="function") return !!e.branch();
    return true;
  };
  // 前置条件：早期事件的选择会解锁/关闭后期事件（形成事件链）
  const reqOk=e=>{
    if(!e.req) return true;
    if(Array.isArray(e.req)) return e.req.every(f=>S.flags && S.flags[f]);
    if(typeof e.req==="function") return !!e.req();
    return true;
  };
  const genderOk=e=>(!e.gender || e.gender==="any" || e.gender===gender);
  // 性格分组过滤：性格专属事件（如“分析家深夜长谈”）仅当玩家性格属于该分组时才出现
  const groupOk=e=>{
    if(!e.mbtiGroup) return true;
    const t=MBTI_TYPES[S.mbti];
    return !!t && t.group===e.mbtiGroup;
  };
  // 时代过滤：时代专属事件（如“分房末班车”“下岗潮”“AI 浪潮”）仅当玩家出生年代匹配时才出现
  const eraOk=e=>{
    if(!e.era) return true;
    return S.era===e.era;
  };
  // 主题年龄合理性：放宽到事件设定年龄段前后 5 岁，避免「上班第一天」出现在工作多年后、
  // 避免「三十五到四十」主题事件出现在年纪很大时（兜底阶段尤其重要）
  const themeOk=e=>(age>=e.minAge && age<=e.maxAge+5);   // 下界严格（不允许触发尚未“开始”的事件，杜绝0岁被冤枉）；上界放宽5岁照顾长寿命边缘
  // 1) 精确年龄 + 性别 + 职业 + 出身 + 关系状态 + 职业阶段 + 学科方向 + 前置条件 + 性格分组 + 时代 + 尚未使用
  let pool=ALL_EVENTS.filter(e=>age>=e.minAge && age<=e.maxAge && genderOk(e) && trackOk(e) && bgOk(e) && condOk(e) && phaseOk(e) && branchOk(e) && reqOk(e) && groupOk(e) && eraOk(e) && !S.usedEvents.includes(e.id));
  if(!pool.length){
    // 2) 同人生阶段内、主题年龄合理、尚未使用（放宽到阶段边界，避免窄年龄段提前“过期”）
    pool=ALL_EVENTS.filter(e=>phaseLo(e.minAge)===phLo && themeOk(e) && genderOk(e) && trackOk(e) && bgOk(e) && condOk(e) && phaseOk(e) && branchOk(e) && reqOk(e) && groupOk(e) && eraOk(e) && !S.usedEvents.includes(e.id));
  }
  if(!pool.length){
    // 3) 任意尚未使用（仍按职业/出身/关系/主题年龄/学科方向/前置条件/性格分组/时代过滤）
    pool=ALL_EVENTS.filter(e=>themeOk(e) && genderOk(e) && trackOk(e) && bgOk(e) && condOk(e) && phaseOk(e) && branchOk(e) && reqOk(e) && groupOk(e) && eraOk(e) && !S.usedEvents.includes(e.id));
  }
  if(!pool.length){
    // 4) 极长人生兜底（允许复用，但职业/出身/关系/性格分组/时代仍须匹配，仍须主题年龄合理）
    const fb=ALL_EVENTS.filter(e=>themeOk(e) && genderOk(e) && condOk(e) && branchOk(e) && reqOk(e) && groupOk(e) && eraOk(e));
    if(fb.length) return pick(fb).make();
    return genericEvent(age);
  }
  const chosen=pick(pool);
  S.usedEvents.push(chosen.id);
  return chosen.make();
}

// 固定时间点事件（升学等）：作为当年度的「额外事件」触发，由 buildYearEvents 注入年度队列
function hasMilestoneAt(a){
  if(a===0||a===6||a===12||a===15) return true;
  if(a===17 && S.edu.high!=="职高") return true;                       // 文理分科
  if(a===18 && S.edu.high==="职高") return true;                       // 职高毕业
  if(a===18 && S.edu.high!=="职高" && S.edu.level==="未定") return true; // 高考
  if(a===19 && S.flags.retake) return true;                            // 复读二次高考
  if(a===21 && S.edu.level==="专科" && !S.career && !(S.studyUntil && a < S.studyUntil)) return true; // 专科毕业
  if(a===22 && S.edu.level==="本科" && !S.career && !(S.studyUntil && a < S.studyUntil)) return true; // 本科毕业
  if(a===23 && S.flags.upgraded && !S.career && !(S.studyUntil && a < S.studyUntil)) return true;     // 专升本毕业
  return false;
}
function milestoneFor(a){
  if(a===0) return mBirth();
  if(a===6) return mPrimary();
  if(a===12) return mJunior();
  if(a===15) return mSenior();
  if(a===17 && S.edu.high!=="职高") return mSubject();
  if(a===18 && S.edu.high==="职高") return mVocGrad();
  if(a===18 && S.edu.high!=="职高" && S.edu.level==="未定") return mGaokao();
  if(a===19 && S.flags.retake) return mGaokaoRetry();
  if(a===21 && S.edu.level==="专科" && !S.career && !(S.studyUntil && a < S.studyUntil)) return mZhuanGrad();
  if(a===22 && S.edu.level==="本科" && !S.career && !(S.studyUntil && a < S.studyUntil)) return mGrad();
  if(a===23 && S.flags.upgraded && !S.career && !(S.studyUntil && a < S.studyUntil)) return mGrad();
  return null;
}
function buildYearEvents(a){
  const q=[];
  // 1) 里程碑（固定时间点事件，如升学）作为当年度的主线/额外事件
  const ms=milestoneFor(a);
  if(ms) q.push(ms);
  // 2) 在读期间（读研/留学/高职/专升本在读）：恋爱/婚姻照常，屏蔽职场事件，只走读书日常
  if(S.studyUntil && a < S.studyUntil){
    if(a>=16 && a<=42){ const re=relationEvent(); if(re){ if(re.rid&&!S.usedEvents.includes(re.rid))S.usedEvents.push(re.rid); q.push(re); } }
    const se=studyEvent(a); q.push(se||studyLifeEvent(a));
    return q;
  }
  // 3) 额外突发事件：买房（按现实逻辑的时间与条件触发，至多 2 件）
  const extras=careerExtraEvents(a);
  if(extras.length) q.push(...extras.slice(0,2));
  // 4) 突发事件（机遇/危机）：适龄随机触发，并通过 flags 影响后续收入与晋升
  if(a>=18 && a<=70 && chance(0.085)){
    let sk=SHOCKS.filter(e=>a>=e.minAge && a<=e.maxAge && !S.usedEvents.includes(e.id));
    const cs=(S.career && CSHOCKS[S.career])?CSHOCKS[S.career].filter(e=>a>=e.minAge && a<=e.maxAge && !S.usedEvents.includes(e.id)):[];
    sk=sk.concat(cs);
    if(sk.length){ const c=pick(sk); S.usedEvents.push(c.id); q.push(c.make()); }
  }
  // 4b) 突发考证：职业生涯中前期触发，后期基本不触发（冷却 3 年，只给本职业相关且未考的证书）
  if(S.career && !S.retired && a>=24 && a<=55 && (!S.lastCertAge || a-S.lastCertAge>=3)){
    // 触发概率随职业生涯阶段递减：起步0.65 / 成长0.42 / 成熟0.20 / 巅峰0.08 / 暮年0（不再触发）
    const certProb=[0.65,0.42,0.20,0.08,0][Math.min(careerPhase(),4)];
    if(chance(certProb)){
      // 证书不做硬性阶段限制：全部可见可考；但资历不够时通过率会打折（见 certPassRate）
      const app=CERTS.filter(c=>c.careers.includes(S.career) && !S.certs.includes(c.key));
      if(app.length){ S.lastCertAge=a; q.push(certEvent(app)); }
    }
  }
  // 4c) 突发评职称：触发概率随职称等级逐步降低（初级极易、中级容易、顶级难；冷却 3 年，须达到对应职业阶段的申报门槛）
  if(S.career && !S.retired && titleNames() && a>=26 && a<=58 && S.titleLevel<5 && titlePhaseOk() && (!S.lastTitleAge || a-S.lastTitleAge>=3)){
    // 职称等级与职业阶段绑定（报第n+1级需phase≥n），概率：初级0.5 / 中级0.38 / 副高0.22 / 正高0.12 / 顶级0.06
    const titleProb=[0.5,0.38,0.22,0.12,0.06][Math.min(S.titleLevel,4)];
    if(chance(titleProb)){
      S.lastTitleAge=a;
      q.push(titleEvent());
    }
  }
  // 5) 关系事件（恋爱/结婚/生子）
  if(a>=16 && a<=42){
    const re=relationEvent();
    if(re){ if(re.rid&&!S.usedEvents.includes(re.rid))S.usedEvents.push(re.rid); q.push(re); }
  }
  // 6) 每年必有的主日常事件（年度抉择）
  q.push(pickEvent(a, S.gender));
  return q;
}
function buildTurn(){
  const a=S.age;
  // 连锁/定向 pending 优先（升学选校、取名、决策连锁等）
  // 用 age<=a 而非严格相等：若因任何原因跨年后 pending 年龄"过期"（如选城市后推进年份），
  // 仍在下一年补触发，避免留学归来等关键定向事件被永久跳过（玩家终身无职业选择）
  if(S.pending && S.pending.age<=a){
    const p=S.pending; S.pending=null;
    if(p.type==="major") return mPickMajor();
    if(p.type==="grad2") return mGradStep2(p.dir);
    if(p.type==="gradMajor") return mGradMajor(p.school,p.tier,p.abroad);
    if(p.type==="gradDone") return mPendingGrad(p.deg);
    if(p.type==="event") return p.ev;
  }
  // 当年事件队列：为空则构建这一年的事件列表（里程碑/额外事件/主事件都在队列里）
  if(!S.yearQueue || !S.yearQueue.length){
    S.yearQueue = buildYearEvents(a);
  }
  const ev = S.yearQueue.shift();
  if(ev) return ev;
  return genericEvent(a);
}

/* ===================== 死亡判定 ===================== */
function deathRoll(){
  const h=S.health;
  // 55 岁以下：极低概率的意外/重疾（健康极差者略升），但整体很低
  if(S.age<55){
    let young = 0.0005 + (100-h)/100*0.0012;
    let acc = chance(0.0004*(100-h)/60);
    return chance(young)||acc;
  }
  // 55 岁起：以健康为主权重，年龄自然衰减平缓，运气占极小份额（贴近现实寿命曲线）
  const a=S.age;
  let baseByAge;
   if(a<60) baseByAge=0.004;
   else if(a<65) baseByAge=0.008;
   else if(a<70) baseByAge=0.013;
   else if(a<75) baseByAge=0.024;
   else if(a<80) baseByAge=0.045;
   else if(a<85) baseByAge=0.080;
   else if(a<90) baseByAge=0.130;
   else if(a<95) baseByAge=0.220;
   else if(a<100) baseByAge=0.350;
   else baseByAge=0.520;
  // 健康缺口放大/缩小死亡率：健康 80→约×0.55，健康 20→约×1.8
  const healthMul = clamp(1 + (50-h)/50*0.9, 0.4, 2.2);
   if(a>=110) return true;
   let total = baseByAge*healthMul + (100-S.luck)/100*0.004;
  let accident = chance(0.0008*(100-h)/55);   // 意外（低概率，健康差者略高）
  return chance(total)||accident;
}

/* ===================== 推进一年 ===================== */
// 幸福对发展的真实反馈：长期低落会侵蚀健康与人际（情商），愉悦则缓慢回补——这让“幸福”不再是摆设
function moodDrift(){
  if(S.happy<30){
    S.health=clamp(S.health-R(0,1),0,ATTR_CAP);            // 郁郁寡欢伤身
    if(chance(0.45)) S.eq=clamp(S.eq-1,0,ATTR_CAP);        // 情绪低落让人际收紧
  } else if(S.happy>72){
    if(chance(0.40)) S.health=clamp(S.health+1,0,ATTR_CAP);
    if(chance(0.30)) S.eq=clamp(S.eq+1,0,ATTR_CAP);
  }
}
// —— 学识自然增长：初始为 0，3 岁起每年自然增长 +1（无论是否上学）；
//    上学（进入小学/初中/高中/大学）的当年由入学事件立即 +5（一次性）；
//    重点学校（重点小学/初中/高中、民办双语）在校期间每年有概率额外 +1~2；
//    学识自然增长到大学/研究生毕业为止（毕业或工作后停止，靠事件/证书继续积累）。 ——
function isStudying(){
  if(S.retired || S.career) return false;
  const a=S.age;
  if(S.studyUntil && a < S.studyUntil) return true;   // 专科/专升本/研究生在读
  if(a>=6 && a<=11 && S.edu.school) return true;      // 小学
  if(a>=12 && a<=17 && S.edu.high) return true;       // 初中/高中/职高
  if(a>=18 && a<=22 && S.edu.uni) return true;        // 大学在读
  return false;
}
function knowledgeDrift(){
  const a=S.age;
  if(a<3 || S.retired || S.career) return;            // 3岁前/退休/已工作：不自然增长
  if(!isStudying() && a>=22) return;                  // 22岁后无在读：毕业停止
  // 学识增长受智商加成：聪明人学得快（效率约 0.3~0.9 倍），同样努力笨人学得慢——更贴近现实（下调）
  let gain = 0.3 + S.iq/100*0.6;                      // iq0→0.3，iq50→0.6，iq100→0.9
  if(isStudying()){
    const key = (S.edu.school==="重点小学"||S.edu.school==="民办双语"||S.edu.high==="重点初中"||S.edu.high==="重点高中");
    if(key && chance(0.6)){ gain += R(1,2); S.happy=clamp(S.happy-R(0,1),0,ATTR_CAP); }  // 重点校加码，但更辛苦，略损幸福（代价）
  }
  S.knowledge += gain;
}
function advanceYear(){
  S.age++;
  S.yearQueue=[];   // 新的一年重新构建年度事件队列
  _yearRolls={};    // 新的一年清空掷骰缓存：同回合运势一致，跨回合重新掷
  // 统一把核心属性归一化到 [0,150]，防止晋升/事件直加越界
  ["iq","eq","look","health","luck","happy"].forEach(k=>{ S[k]=clamp(S[k],0,ATTR_CAP); });
  // 幸福温和回落：没有谁的人生能一直高歌——偏高时年终轻微回落，避免幸福长期触顶、丧失区分度
  if(S.happy>72) S.happy=clamp(S.happy-R(0,2),0,ATTR_CAP);
  if(S.age>28) S.health=clamp(S.health-R(0,1)-(S.age>60?R(0,2):0),0,ATTR_CAP);
  if(S.career) careerTick();
  moodDrift();
  knowledgeDrift();   // 学识自然增长（3岁~毕业）
  // 离校入职后（学术科研除外），知识若不持续更新会缓慢老化——抵消成年零散灌入，避免学识虚高（贴近“用进废退”）
  if(S.career && S.career!=="学术科研" && S.age>=23){
    S.knowledge=Math.max(0, S.knowledge - R(0,1));
  }
  childTick();
  if(deathRoll()){ S.alive=false; }
}
function childTick(){
  if(S.spouse && !S.dating && S.childrenList.length<(S.wealth>200?4:2) && S.age>=23 && S.age<=45 && chance(0.05)){
    // 与主动添丁走同一条取名链，避免「凭空多了个没起名的孩子」；pending 被占用时才退回直接落户
    if(!S.pending){ S.pending={type:"event",age:S.age,ev:nameBabyEvent()}; }
    else { addChild(); }
  }
}

/* ===================== 人生评价 ===================== */
const EPITAPH={
  "人生赢家":"你把一手牌打到了极致，世间的好运气仿佛都偏爱了你。",
  "圆满人生":"事业家庭两不误，回望时心里是满的。",
  "安稳知足":"没有大起大落，却把日子过成了自己想要的模样。",
  "跌宕起伏":"你经历过高峰也跌入过谷底，这就是真实的人生。",
  "坎坷前行":"路走得不容易，但你始终没有松手。",
  "命运多舛":"这一程风雨太多，愿你下一世被温柔以待。"
};
function evaluate(){
  let maxRank = S.career? CAREERS[S.career].ranks.length : 1;
  let careerScore = S.career? Math.round((S.rankIdx+1)/maxRank*100) : 15;
  let wealthScore = clamp(Math.round(Math.log10(S.wealth+10)*28),0,100);
  let familyScore = clamp((S.spouse?40:0)+S.children*12+S.happy*0.45,0,100);
  let healthScore = S.health;
  let repScore = clamp(S.status*1.2 + (S.titles.length*8),0,100);
  let overall = Math.round(careerScore*0.26+wealthScore*0.22+familyScore*0.20+healthScore*0.16+repScore*0.16);
  let title="平凡一生";
  if(overall>=88)title="人生赢家";
  else if(overall>=78)title="圆满人生";
  else if(overall>=66)title="安稳知足";
  else if(overall>=52)title="跌宕起伏";
  else if(overall>=38)title="坎坷前行";
  else title="命运多舛";
  if(S.wealth>=300&&!S.titles.includes("富甲一方"))S.titles.push("富甲一方");
  if(S.children>=3&&!S.titles.includes("儿孙满堂"))S.titles.push("儿孙满堂");
  if(S.health>=85&&S.age>=80&&!S.titles.includes("福寿双全"))S.titles.push("福寿双全");
  if(S.career&&!S.titles.includes("事业有成"))S.titles.push("事业有成");
  return {careerScore,wealthScore,familyScore,healthScore,repScore,overall,title,epitaph:EPITAPH[title]};
}

function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return null;
    const d=JSON.parse(raw);
    S=d.state; S.alive=(S.alive!==false);
    S.usedEvents = Array.isArray(S.usedEvents)?S.usedEvents:[];
    pace=d.pace||"standard";

    bgSel = S.bg||"工薪家庭";
    S.region = S.region||"东部省会";

    S.certs = S.certs||[];
    S.titleLevel = S.titleLevel||0;
    S.studyUntil = S.studyUntil||null;
    S.timeline = S.timeline||[];
    S.annualIncome = S.annualIncome||0;
    S.childrenList = Array.isArray(S.childrenList)?S.childrenList:[];
    S.edu = S.edu||{};
    S.edu.level = S.edu.level||"未定";
    S.yearQueue = Array.isArray(S.yearQueue)?S.yearQueue:[];
    S.yearInRank = S.yearInRank||0;
    S.careerStartAge = S.careerStartAge||null;
    S.lastCertAge = S.lastCertAge||null;
    S.lastTitleAge = S.lastTitleAge||null;
    S.lastHouseAge = S.lastHouseAge||null;
    if(S.childrenList.length) S.children = S.childrenList.length;
    // 事件对象里的 ef/then 是函数，无法序列化；加载时丢弃「带剧情的事件」型 pending，
    // 并清空年度队列（当年剩余事件会按已用事件集重新生成，避免重复）
    S.pending = (S.pending && S.pending.type!=="event") ? S.pending : null;
    S.yearQueue = [];
    RngState=(typeof d.rng==="number")?d.rng:0;
    pendingResult=d.pendingResult||null;
    pendingDelta=null;
    lastOpt = pendingResult?{stay:!!d.pendingStay}:null;
    return d;
  }catch(e){ return null; }
}

function snapAttrs(){
  return {iq:S.iq,eq:S.eq,look:S.look,health:S.health,luck:S.luck,wealth:S.wealth,happy:S.happy,knowledge:S.knowledge,status:S.status,
    spouse:S.spouse,dating:S.dating,children:S.children,eduUni:S.edu.uni,career:S.career};
}
function computeDelta(b){
  const out=[];
  const num=[["iq","智商"],["eq","情商"],["look","颜值"],["health","健康"],["luck","运气"],["happy","幸福"],["knowledge","学识"],["status","名望"],["wealth","财富"]];
  num.forEach(([k,lab])=>{
    const d=Math.round(S[k]-b[k]);
    if(d!==0){
      const unit=(k==="wealth")?"万":"";
      out.push({lab,d,unit});
    }
  });
  if(!b.spouse && S.spouse) out.push({label:`与 ${spouseName()} 结婚`,kind:"good"});
  if(!b.dating && S.dating && !S.spouse) out.push({label:`与 ${S.dating} 确立恋爱`,kind:"good"});
  if(S.children>b.children) out.push({label:`迎来孩子：${S.childrenList.map(c=>c.name).slice(b.children).join("、")}`,kind:"good"});
  if(S.edu.uni && !b.eduUni) out.push({label:`就读 ${S.edu.uni}`,kind:"good"});
  if(S.career && !b.career) out.push({label:`入职 ${S.career}·${S.rank}`,kind:"good"});
  if(!b.career && S.career && S.rankIdx>0) out.push({label:`晋升 ${S.rank}`,kind:"good"});
  return out;
}
function deltaHtml(d){
  if(!d||!d.length) return `<div class="deltas"><span class="dchip neutral">属性无明显变化</span></div>`;
  return `<div class="deltas">`+d.map(x=>{
    if(x.label) return `<span class="dchip ${x.kind}">${x.label}</span>`;
    const sign=x.d>0?"+":"";
    const cls=x.d>0?"up":(x.d<0?"down":"neutral");
    return `<span class="dchip ${cls}">${x.lab} ${sign}${x.d}${x.unit||""}</span>`;
  }).join("")+`</div>`;
}
