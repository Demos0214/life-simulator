  if(randBtn) randBtn.onclick=()=>{
    bgSel=BACKGROUNDS[Math.floor(Math.random()*BACKGROUNDS.length)].key;
    regionSel=REGIONS[Math.floor(Math.random()*REGIONS.length)].key;
    mbtiSel="auto";
    eraSel=ERA_KEYS[Math.floor(Math.random()*ERA_KEYS.length)];
    document.querySelectorAll("#bg button").forEach(x=>x.classList.toggle("on",x.dataset.bg===bgSel));
    document.getElementById("bgdesc").textContent=BACKGROUNDS.find(x=>x.key===bgSel).desc;
    document.querySelectorAll("#region button").forEach(x=>x.classList.toggle("on",x.dataset.r===regionSel));
    document.getElementById("regdesc").textContent=REGIONS.find(x=>x.key===regionSel).desc;
    document.querySelectorAll("#mbti button").forEach(x=>x.classList.toggle("on",x.dataset.m==="auto"));
    document.getElementById("mbtidesc").textContent="系统将按真实人群比例为你抽取一种性格底色。";
    document.querySelectorAll("#era button").forEach(x=>x.classList.toggle("on",x.dataset.e===eraSel));
    document.getElementById("eradesc").textContent=ERA_DESC[eraSel];
  };
  if(hasSave){
    document.getElementById("cont").onclick=()=>{
      const d=loadGame();
      if(!d){ renderStart(); return; }
      if(S.alive){ if(pendingResult) renderResult(); else renderTurn(); } else { renderEval(); }
    };
  }
}
function restartFresh(){
  clearSave();
  try{ const u=new URL(location.href); u.searchParams.delete("seed"); history.replaceState(null,"",u); }catch(e){}
  renderStart();
}
function startGame(name,seed,gender,bgKey,regionKey,fresh,mbtiKey,eraKey){
  if(fresh) clearSave();
  newState(name,seed,gender,bgKey,regionKey,mbtiKey,eraKey);
  const url=new URL(location.href); url.searchParams.set("seed",seed); history.replaceState(null,"",url);
  renderTurn();
}

function renderTurn(){
  if(!S.alive){ renderEval(); return; }
  if(pendingResult){ renderResult(); return; }
  const t=buildTurn();
  const isShock=(t.title&&t.title.indexOf("突发")===0);   // 随机突发事件（SHOCKS/CSHOCKS）高亮+弹窗提醒
  const stageHtml=t.stage?`<div class="stage"${isShock?' style="background:#e0531a;color:#fff;"':''}>${isShock?'⚡ ':''}${t.stage}</div>`:"";
  const optsHtml=t.opts.map((o,i)=>`<button class="opt${o.disabled?' disabled':''}" data-i="${i}"${o.disabled?' disabled':''}>${o.label}${o.sub?`<small>${o.sub}</small>`:""}${o.disabled?`<small class="lock">🔒 ${o.lockMsg||'未达标'}</small>`:""}</button>`).join("");
  const ffHtml = pace==="immerse"?"":
    (pace==="skip"
      ? `<button class="act ghost" id="ff">⏩ 一路快进到终章</button>`
      : `<button class="act ghost" id="ff">⏩ 快进到下一决策</button>`);
  app().innerHTML=`
    <div class="card">
      <div class="topbar">
        <div><span class="who">${S.name}</span> <span class="age">· ${S.age}岁 ${genderSym(S.gender)}</span></div>
        <div class="seedbox">种子 <b>${S.seed}</b> · ${pace==="immerse"?"沉浸":pace==="skip"?"速通":"标准"}</div>
      </div>
      <div class="grid">
        ${ATTR_META.map(a=>attrBar(a[0],S[a[0]],a[3])).join("")}
        <div class="attr"><div class="lab"><span>资产(万)</span><span>${Math.round(S.wealth)}</span></div><div class="bar"><i style="width:${clamp(S.wealth/300*100,0,100)}%;background:#854f0b"></i></div></div>
        <div class="attr"><div class="lab"><span>幸福</span><span>${Math.round(S.happy)}</span></div><div class="bar"><i style="width:${clamp(S.happy/ATTR_CAP*100,0,100)}%;background:#3b6d11"></i></div></div>
        <div class="attr"><div class="lab"><span>名望</span><span>${Math.round(S.status)}</span></div><div class="bar"><i style="width:${clamp(S.status/ATTR_CAP*100,0,100)}%;background:#7a3b8f"></i></div></div>
      </div>
      <div class="res">
        <span class="pill">出身：${S.bg}</span>
        <span class="pill">地区：${S.region}</span>
        <span class="pill">时代：${S.era}（生于${S.bornYear}年）</span>
        ${S.talents.length?`<span class="pill">特长：${S.talents.join("、")}</span>`:``}
        ${S.certs.length?`<span class="pill">证书：${S.certs.length>3?S.certs.slice(0,3).join("、")+" 等"+S.certs.length+"项":S.certs.join("、")}</span>`:``}
        ${S.titleLevel>0?`<span class="pill">职称：${(titleNames()||["初级","中级","副高级","正高级","顶级"])[Math.min(S.titleLevel-1,4)]}</span>`:``}
        ${S.career?`<span class="pill">职业：${S.career}·${S.rank}</span>`:`<span class="pill">职业：未定</span>`}
        ${S.career?`<span class="pill">月均收入 ¥${Math.round((S.annualIncome||S.salary*12)/12).toLocaleString()}</span>`:``}
        ${S.career?`<span class="pill">年支出 ≈ ¥${Math.round((S.annualExpense||0)*10000).toLocaleString()}</span>`:``}
        ${S.career?`<span class="pill">年结余 ≈ ¥${Math.round((S.annualSurplus||0)*10000).toLocaleString()}</span>`:``}
        ${S.edu.uni?`<span class="pill">母校：${S.edu.uni}·${S.edu.major}</span>`:``}
        ${eduLevelText()!=="未定"?`<span class="pill">学历：${eduLevelText()}</span>`:``}
        <span class="pill" title="${mbtiBlurb(S.mbti)}">性格：${S.mbti}·${MBTI_TYPES[S.mbti].name}</span>
        <span class="pill">感情：${relState()}</span>
        ${S.children?`<span class="pill">子女：${S.childrenList.map(c=>c.name).join("、")}</span>`:``}
      </div>
    </div>
    <div class="card">
      ${iconHtml(t.icon)}
      ${stageHtml}
      <div class="narr">${t.narr}</div>
      <div class="opts">${optsHtml}</div>
      <div class="row">
        ${ffHtml}
        <button class="act ghost" id="share">🔗 复制分享链接</button>
        <button class="act ghost" id="restart">↻ 重开</button>
      </div>
    </div>
    <div class="card">
      <div class="stage">人生轨迹</div>
      <div class="log" id="log">${S.log.slice(-40).map(l=>`<div class="li"><b>${l.age}岁</b> ${l.txt}</div>`).join("")}</div>
    </div>${footHtml()}`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>chooseTurn(t,parseInt(b.dataset.i)));
  if(ffHtml) document.getElementById("ff").onclick=()=>{ if(pace==="skip") autoRun(); else fastForward(); };
  document.getElementById("share").onclick=()=>copyShare();
  document.getElementById("restart").onclick=()=>{ restartFresh(); };
  const log=document.getElementById("log"); if(log)log.scrollTop=log.scrollHeight;
  flushNotables();
  // 随机突发事件重点弹窗提醒（速通模式不打断节奏）
  if(isShock && pace!=="skip"){
    showPopup("⚠ 突发事件", `<div style="font-weight:700;margin-bottom:6px;color:#e0531a;">${t.title}</div><div>${t.narr}</div>`, t.icon||"bolt");
  }
  saveGame();
}
function chooseTurn(t,i){
  const before=snapAttrs();
  const o=t.opts[i];
  o.ef(o);
  amplifyTurnDelta(before);   // 统一放大本次决策的属性变化幅度
  const tradeoffMsg=applyTradeoff(before);   // 大额纯收益 → 自动附加隐性代价（有得必有失）
  maybeTwist();               // 选择后可能随机引出突发小事（再影响属性）
  pendingDelta=computeDelta(before);
  pendingResult=o.res + (tradeoffMsg||"") + (S._twistRes?`<span style="display:block;margin-top:6px;color:#a05a1a;font-weight:600;">${S._twistRes}</span>`:"");
  S._twistRes=null;
  lastOpt=o;
  // 决策连锁突发事件：某些选择会立刻引出一段新剧情（停留同岁，不推进年份）
  if(o.then){
    const ev=(typeof o.then==="function")?o.then():o.then;
    if(ev){ S.pending={type:"event",age:S.age,ev}; if(ev.rid)S.usedEvents.push(ev.rid); lastOpt={stay:true}; }
  }
  pushLog(S.age,`【${t.title.split(" · ").pop()}】${o.label} — ${o.res}`);
  renderResult();
}
function renderResult(){
  app().innerHTML=`
    <div class="card">
      <div class="topbar"><div><span class="who">${S.name}</span> <span class="age">· ${S.age}岁 ${genderSym(S.gender)}</span></div></div>
    </div>
    <div class="card">
      <div class="result">${pendingResult}</div>
      <div class="deltatip">本次决策的属性变化：</div>
      ${deltaHtml(pendingDelta)}
      <div class="row"><button class="act" id="next">继续 →</button></div>
    </div>
    <div class="card"><div class="stage">人生轨迹</div>
      <div class="log">${S.log.slice(-40).map(l=>`<div class="li"><b>${l.age}岁</b> ${l.txt}</div>`).join("")}</div>
    </div>${footHtml()}`;
  document.getElementById("next").onclick=()=>{
    const stay = lastOpt && lastOpt.stay;
    pendingResult=null; pendingDelta=null; lastOpt=null;
    // 当年事件队列还有剩余（额外事件等）→ 先不推进年份，继续同岁的下一个事件
    if(!stay && !(S.yearQueue && S.yearQueue.length)) advanceYear();
    if(S.alive) renderTurn(); else renderEval();
  };
  flushNotables();
  saveGame();
}
function fastForward(){
  let guard=0;
  let stepped=0;
  while(S.alive && guard<200 && stepped<8){
    guard++;
    const a=S.age+1;
    const hasMilestone=hasMilestoneAt(a) || (S.pending&&S.pending.age<=a);
    advanceYear();
    stepped++;
    if(!S.alive)break;
    if(hasMilestone)break;
    if(S.age>=100)break;
  }
  pendingResult=null; pendingDelta=null;
  if(S.alive)renderTurn();else renderEval();
}
function autoRun(){
  let guard=0;
  while(S.alive && guard<3000){
    guard++;
    if(pendingResult){
      const stay=lastOpt&&lastOpt.stay;
      pendingResult=null; pendingDelta=null; lastOpt=null;
      // 与手动模式 renderResult 的「继续」逻辑完全一致：
      // stay（连锁剧情）或当年事件队列还有剩余 → 停留同龄继续；否则才推进年份。
      // （修复：此前无条件推进导致每年跳 2 岁，15 岁中考/17 岁分科等里程碑被跳过）
      if(!stay && (!S.yearQueue||!S.yearQueue.length)) advanceYear();
      continue;
    }
    const t=buildTurn();
    const o=t.opts[Math.floor(rng()*t.opts.length)];
    const before=snapAttrs();
    o.ef(o); amplifyTurnDelta(before); maybeTwist(); pendingResult=o.res; lastOpt=o;
    if(o.then){
      const ev=(typeof o.then==="function")?o.then():o.then;
      if(ev){ S.pending={type:"event",age:S.age,ev}; if(ev.rid)S.usedEvents.push(ev.rid); lastOpt={stay:true}; }
    }
    // 不再在此推进年份：统一由上面的 pendingResult 分支决定，避免重复推进
  }
  if(S.alive){ renderTurn(); } else { renderEval(); }
}

function renderEval(){
  const e=evaluate();
  const sc=[["事业",e.careerScore],["财富",e.wealthScore],["家庭",e.familyScore],["健康",e.healthScore],["名誉",e.repScore]];
  // 简历素材
  const eduTxt=[S.edu.school||null,S.edu.high||null,(S.edu.uni?`${S.edu.uni}·${S.edu.major||""}${S.edu.branch?"（"+S.edu.branch+"）":""}`:null)].filter(Boolean).join(" → ")||"未受正式教育";
  const careerTxt = S.career? `${S.career}·${S.rank}${S.retired?"（已退休）":""}` : "平凡过客";
  const incomeTxt = S.career? `月均收入约 ¥${Math.round((S.annualIncome||S.salary*12)/12).toLocaleString()}（基础月薪 ¥${S.salary.toLocaleString()}）` : "无稳定收入";
  const titleTxt = S.titleLevel>0? (titleNames()||["初级","中级","副高级","正高级","顶级"])[Math.min(S.titleLevel-1,4)] : "无";
  const talentTxt = S.talents.length? S.talents.join("、") : "无";
  const certTxt = S.certs.length? S.certs.join("、") : "无";
  const evalTxt=`${S.name}于 ${S.age}岁 走完了这一生。出身${S.bg}（出生地：${S.region}）${S.city?`，毕业后在${S.city}打拼`:"，留在了故乡"}，最终成为${careerTxt}，坐拥约 ${Math.round(S.wealth)} 万资产${S.childrenList.length?`，育有 ${S.childrenList.map(c=>c.name).join("、")}`:""}。综合评分 ${e.overall}。`;
  // 主要事件：人生时间线 + 人生大事（notables）去重合并，按年龄排序
  const evMap=new Map();
  (S.timeline||[]).forEach(x=>{ if(x&&x.text&&!evMap.has(x.text)) evMap.set(x.text,x.age); });
  (S.notables||[]).forEach(n=>{ if(n&&n.text&&!evMap.has(n.text)) evMap.set(n.text, (n.age!=null?n.age:S.age)); });
  const evs=[...evMap.entries()].map(([text,age])=>({text,age})).sort((a,b)=>a.age-b.age);
  const evHtml = evs.length
    ? `<div class="log">${evs.map(x=>`<div class="li"><b>${x.age}岁</b> ${x.text}</div>`).join("")}</div>`
    : `<div class="tip">一生平淡，无大事可记。</div>`;
  app().innerHTML=`
    <div class="card">
      <div class="evalucon">${ICONS.trophy}</div>
      <div class="title-sub">人生终章 · 战绩卡</div>
      <div class="title-big">${e.title}</div>
      <div class="title-sub">种子 ${S.seed} · 享年 ${S.age} 岁 ${genderSym(S.gender)} · ${S.bg} · ${S.region}${S.city?` · 就业于 ${S.city}`:""}</div>
      <div class="scoregrid">
        ${sc.map(([k,v])=>`<div class="sc"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("")}
      </div>
      <div class="res" style="justify-content:center;">
        ${S.titles.length?S.titles.map(t=>`<span class="pill">${t}</span>`).join(""):`<span class="pill">无名之辈</span>`}
      </div>
      <p class="narr" style="margin-top:10px;text-align:center;">${evalTxt}</p>
      <p class="tip" style="text-align:center;">${e.epitaph}</p>
      <div class="row" style="justify-content:center;">
        <button class="act" id="again">↻ 再走一遭</button>
        <button class="act ghost" id="share2">🔗 复制分享链接</button>
      </div>
    </div>
    <div class="card">
      <div class="stage">人生简历</div>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px;line-height:2;margin-top:6px;">
        <b style="color:#6b4a2b;">时代</b><span>${S.era}（生于 ${S.bornYear} 年）</span>
        <b style="color:#6b4a2b;">学历</b><span>${eduTxt}${S.grad?`（${S.grad}）`:""}${eduLevelText()!=="未定"?` · 学历层级：${eduLevelText()}`:""}</span>
        <b style="color:#6b4a2b;">职业</b><span>${careerTxt}${S.retired?" · 已退休":""}</span>
        <b style="color:#6b4a2b;">性格</b><span>${S.mbti}·${MBTI_TYPES[S.mbti].name}（${MBTI_TYPES[S.mbti].group}）：${MBTI_TYPES[S.mbti].read}</span>
        <b style="color:#6b4a2b;">收入</b><span>${incomeTxt}</span>
        <b style="color:#6b4a2b;">婚姻</b><span>${S.spouse?`已婚 · ${S.spouse.name}（${S.spouse.family}·${S.spouse.edu}）`:S.dating?`恋爱（${S.dating}）`:"未婚"}</span>
        <b style="color:#6b4a2b;">子女</b><span>${S.childrenList.length?`${S.childrenList.length} 名（${S.childrenList.map(c=>`${c.name}${c.gender==="F"?"♀":"♂"}`).join("、")}）`:"无"}</span>
        <b style="color:#6b4a2b;">资产</b><span>约 ${Math.round(S.wealth)} 万元</span>
        <b style="color:#6b4a2b;">特长</b><span>${talentTxt}</span>
        <b style="color:#6b4a2b;">证书</b><span>${certTxt}</span>
        <b style="color:#6b4a2b;">职称</b><span>${titleTxt}</span>
        <b style="color:#6b4a2b;">头衔</b><span>${S.titles.length?S.titles.join("、"):"无"}</span>
      </div>
    </div>
    <div class="card">
      <div class="stage">主要事件</div>
      ${evHtml}
    </div>
    <div class="tip" style="text-align:center;margin-top:8px;">同一个种子，人生完全相同——这就是命运的确定性。</div>
    ${footHtml()}`;
  document.getElementById("again").onclick=()=>{ restartFresh(); };
  document.getElementById("share2").onclick=()=>copyShare();
  flushNotables();
  clearSave();
}
function copyShare(){
  const url=new URL(location.href); url.searchParams.set("seed",S.seed);
  navigator.clipboard?.writeText(url.toString()).then(()=>alert("分享链接已复制："+url.toString()),()=>prompt("复制此链接：",url.toString()));
}

function showPopup(title, html, icon){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;';
  const iconHtml = (icon&&ICONS[icon])?`<div style="width:60px;height:60px;margin:0 auto 6px;">${ICONS[icon]}</div>`:'';
  ov.innerHTML=`<div style="background:#fff;border-radius:14px;max-width:440px;width:100%;padding:22px;box-shadow:0 12px 44px rgba(0,0,0,.3);">
     ${iconHtml}
     <div style="font-size:20px;font-weight:800;text-align:center;color:#993c1d;margin-bottom:8px;">${title}</div>
     <div style="font-size:15px;line-height:1.85;max-height:56vh;overflow:auto;">${html}</div>
     <div style="text-align:center;margin-top:16px;"><button id="popok" style="background:#185fa5;color:#fff;border:none;border-radius:10px;padding:9px 28px;font-size:15px;cursor:pointer;">好的</button></div>
   </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#popok').onclick=()=>ov.remove();
}
function flushNotables(){
  if(!S || !S.notables || !S.notables.length) return;
  const items=S.notables; S.notables=[];
  showPopup("人生大事提醒", items.map(i=>`<div style="margin:5px 0;">· ${i.text}</div>`).join(""), items[0].icon);
}

function app(){return document.getElementById("app");}

/* ===================== 启动 ===================== */
renderStart();
</script>
</body>
</html>
